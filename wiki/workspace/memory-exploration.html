</style><body><main hidden></main><script>const KEY="april-memory-exploration-v1";const seed={"title": "April memory exploration", "notes": "Memory Q&A paused for this research. Supermemory is a reference, not a selected provider.", "questions": "Provider choice, inference review policy, historical revival, deletion propagation, private context enforcement.", "candidates": [], "experiments": [], "decisions": [{"title": "Sources", "category": "Lifecycle", "caption": "Original evidence", "rationale": "Store source material separately from extracted facts and prompt context. Index completion and memory extraction completion are distinct.", "source": "https://supermemory.ai/docs/concepts/how-it-works", "status": "Documented behavior"}, {"title": "Extraction", "category": "Lifecycle", "caption": "Background learning", "rationale": "Dynamic dreaming groups related material. Instant processing handles one document when immediate availability matters; this is not a guarantee of zero latency.", "source": "https://supermemory.ai/docs/concepts/how-it-works", "status": "Documented behavior"}, {"title": "Relationships", "category": "Lifecycle", "caption": "Update \u00b7 extend \u00b7 derive", "rationale": "A changed fact replaces current truth; added detail enriches it; an inference is a conclusion not explicitly stated. Preserve the distinction between evidence and guesses.", "source": "https://supermemory.ai/docs/concepts/graph-memory", "status": "Documented behavior"}, {"title": "Recall", "category": "Lifecycle", "caption": "Chunks \u00b7 graph \u00b7 profile", "rationale": "Use chunks to ground answers, graph facts for connected knowledge, and static/dynamic profiles for compact context. April must filter all three by current task authority.", "source": "https://supermemory.ai/docs/quickstart", "status": "Documented behavior"}, {"title": "Time expiry", "category": "Forgetting", "caption": "Temporary relevance ends", "rationale": "Supermemory describes automatic expiry of temporary facts. Legacy APIs expose scheduled forgetting; do not copy those fields into v5 without compatibility validation. Expiry is not proof of physical erasure.", "source": "https://supermemory.ai/docs/concepts/graph-memory", "status": "Documented behavior"}, {"title": "Superseded facts", "category": "Forgetting", "caption": "Current truth changes", "rationale": "Updated information takes precedence for current answers; older facts can remain historical. Ambiguous contradictions in April\u2019s wiki still require user clarification.", "source": "https://supermemory.ai/docs/concepts/graph-memory", "status": "Documented behavior"}, {"title": "Soft forgetting", "category": "Forgetting", "caption": "Hidden from normal recall", "rationale": "The current memory operation excludes a forgotten fact from normal search but preserves it. Forgetting is separate from source deletion and permanent erasure.", "source": "https://supermemory.ai/docs/recall/memory-operations", "status": "Documented behavior"}, {"title": "Historical recall", "category": "Forgetting", "caption": "Retrievable is not revived", "rationale": "Migration docs distinguish list visibility from search including forgotten records. Historical retrieval does not itself mean a fact should become current again. April\u2019s revival policy remains open.", "source": "https://supermemory.ai/docs/migration/api-v5-document-reads", "status": "Documented behavior"}, {"title": "Inference review", "category": "Forgetting", "caption": "Approve \u00b7 decline \u00b7 undo", "rationale": "Inferred memories can be approved, declined or returned to an unreviewed state. Decline forgets an inference; undo can un-forget that declined item. Do not generalize this to every deletion.", "source": "https://supermemory.ai/docs/recall/memory-review", "status": "Documented behavior"}, {"title": "Permanent deletion", "category": "Forgetting", "caption": "Separate lifecycle", "rationale": "April\u2019s recoverable bin and weekly user review ry mode", "rationale": "Provide a don\u2019t-remember-this mode excluding the conversation from durable memory. Transcript retention and mode scope remain open.", "status": "Confirmed direction", "category": "April fit", "caption": "Confirmed April decision"}, {"title": "No-memory transcript and lifetime", "rationale": "Omit saved transcripts and durable extraction. Persist until explicitly turned off with a visible indicator, including across dismissal/resummoning.", "status": "Confirmed direction", "category": "April fit", "caption": "Confirmed April decision"}, {"title": "Cross-device no-memory and artifacts", "rationale": "Apply across devices. Confirm retention of specifically requested saved artifacts. Excluded conversations remain excluded permanently after mode exit; no retroactive learning.", "status": "Confirmed direction", "category": "April fit", "caption": "Confirmed April decision"}, {"title": "Memory design paused", "rationale": "The user deferred remaining memory detail. Correction propagation, running-task handling and internal grouping are unanswered. Resume later on request; owned memory and all confirmed decisions remain in force.", "status": "Confirmed direction", "category": "April fit", "caption": "Confirmed April decision"}], "memoryPolicyRevision": 1, "memoryInspectionRevision": 1, "memoryPauseRevision": 1};let data=structuredClone(seed);function valid(x){return x&&Array.isArray(x.decisions)&&x.decisions.every(r=>typeof r.title==="string"&&typeof r.category==="string")&&typeof x.notes==="string"&&typeof x.questions==="string"}try{const x=JSON.parse(localStorage.getItem(KEY));if(valid(x))data=x}catch{}if(!data.memoryPolicyRevision){data.decisions.push(...[{"title": "Owned memory; credited references", "rationale": "April will build its own memory system. Supermemory is a strong reference, not a dependency. Credit material design influences in the root README.", "status": "Confirmed direction", "category": "April fit", "caption": "Confirmed Ap (()=>{

let editing=false,editSection='Decisions',editIndex=0;

function fieldKeys(r){if(editSection==='Vision')return ['title','vision','success','principles'];if(editSection==='Notebook')return client?['questions','notes']:['notes'];return Object.keys(r).filter(k=>typeof r[k]==='string'&&k!=='id')}
const labels={basis:'Discussion basis',strength:'Why consider it',risk:'Tradeoffs / uncertainty',next:'Next validation',firstMilestone:'First useful milestone',permissions:'Allowed authority',boundaries:'Boundaries',questions:'Open questions',rationale:'Rationale',source:'Source URL'};
function editorDraw(){
 const records=editRecords();editIndex=Math.max(0,Math.min(editIndex,records.length-1));const r=records[editIndex];
 map.innerHTML=`<header class="am-header"><div><div class="am-eyebrow">APRIL / DETAILED EDITOR</div><h1>Memory exploration</h1><p>The same workspace, with room to edit every detail.</p></div><div class="am-actions"><label class="am-workspace-control"><select aria-label="Choose workspace" data-am-workspace><option value="client-exploration.html" >Client experience</option><option value="agent-system-workspace.html" >Agent system</option><option value="memory-exploration.html" selected>Memory exploration</option></select></label><div class="am-mode-toggle" role="group" aria-label="Workspace view"><button data-am-mode="map" aria-pressed="${!editing}">Map</button><button data-am-mode="editor" aria-pressed="${editing}">Editor</button></div><button data-am-action="export">Export JSON</button><button data-am-action="import">Import JSON</button></div></header><div class="am-editor"><aside class="am-edit-nav" aria-label="Editor sections">${editorSections().map(s=>`<button data-am-section="${h(s)}" aria-pressed="${s===editSection}">${h(s)}</button>`).join('')}<p>Changes save in this browser. Export JSON to keep a portable copy.</p></aside><section class="am-edit-content"><div class="am-edit-top"><h2>${h(editSection)}</h2>${records.length>1?`<label>Record<select aria-label="Choose record" data-am-edit-select>${records.map((x,i)=>`<option value="${i}" ${i===editIndex?'selected':''}>${h(x.title||x.name||('Record '+(i+1)))}</option>`).join('')}</select></label>`:''}</div>${r?fieldKeys(r).map(k=>{const title=labels[k]||k.replace(/([A-Z])/g,' $1').replace(/^./,c=>c.toUpperCase());const short=['title','name','status','category','phase','language','source','url','updatedAt'].includes(k);return `<label class="am-edit-field">${h(title)}${short?`<input aria-label="${h(title)}" data-am-edit-field="${h(k)}" value="${h(r[k])}">`:`<textarea aria-label="${h(title)}" data-am-edit-field="${h(k)}" rows="${['notes','vision','rationale','responsibilities'].includes(k)?5:3}">${h(r[k])}</textarea>`}</label>`}).join(''):'<p>Select another section to continue.</p>'}</section></div><footer class="am-footer"><span id="am-save">Edits save locally · export before moving browsers.</span><span>Confirmed requirements and proposals retain their recorded status.</span></footer><input type="file" accept="application/json,.json" data-am-import-file hidden>`;
}

let zoom=1,needsFit=true,panX=0,panY=0,dragState=null,suppressMapClick=false;

function details(g){
if(g.id==='root')return `<div class="am-eyebrow">MEMORY RESEARCH / 1 NOVEMBER 2026</div><h2>Learn. Update. Forget.</h2><p>Explore how Supermemory separates sources, facts and profiles. Open a branch for evidence and April’s unresolved choices.</p><h3>Four different changes</h3><p>Expiry ends relevance. Updates change current truth. Forgetting hides retained facts. Erasure removes stored data.</p><h3>Read the research</h3><p><a href="../research/memory.md">Full wiki deep dive</a></p><h3>Research status</h3><p>Documentation reviewed with Exa. No live provider tests, installation or vendor selection. Existing privacy rules remain in force.</p>`;
let records=g.records;
return `<div class="am-eyebrow">${h(lens.toUpperCase())} / ${records.length} RECORD${records.length===1?'':'S'}</div><h2>${h(g.title)}</h2><p>${h(g.caption)}</p>`+records.map((r,i)=>{
const title=r.title||r.name;
let body='',edit='';
if(g.kind==='candidate')body=`<p>${h(r.basis)}</p><h3>Why consider it</h3><p>${h(r.strength)}</p><h3>Tradeoffs</h3><p>${h(r.risk)}</p><h3>Next validation</h3><p>${h(r.next)}</p>`;
else if(g.kind==='agent')body=`<p>${h(r.purpose)}</p><h3>Responsibilities</h3><p>${h(r.responsibilities)}</p><h3>First milestone</h3><p>${h(r.firstMilestone)}</p><h3>Boundaries</h3><p>${h(r.boundaries)}</p>`;
else if(g.kind==='platform')body=`<p>${h(r.purpose)}</p><h3>Uncertainty</h3><p>${h(r.caveat)}</p>`;
else if(g.kind==='experiment')body=`<p>${h(r.procedure)}</p><h3>Evidence to collect</h3><p>${h(r.evidence)}</p>`;
else if(g.kind==='task')body=`<p>${h(r.phase)}</p><p>${h(r.notes)}</p>`;
else body=`<p>${h(r.rationale||'')}</p>${r.next?`<h3>Next validation</h3><p>${h(r.next)}</p>`:''}`;
const statusOptions=g.kind==='candidate'?['Explore','Defer','Selected','Ruled out']:g.kind==='experiment'?['Planned','In progress','Passed','Failed','Inconclusive']:null;

const url=r.source||'';
return `<details class="am-record" ${records.length===1?'open':''}><summary>${h(title)}</summary><span class="am-status">${h(shortStatus(r))}</span>${body}${/^https:\/\//.test(url)?`<p><a href="${h(url)}" target="_blank" rel="noopener">Primary reference</a></p>`:''}${edit}</details>`;
}).join('');
}
function draw(){
if(editing){editorDraw();return}
const all=groups().filter(g=>g.records.length);if(active!=='root'&&!all.some(g=>g.id===active))active='root';
const visible=all;const sideCount=Math.ceil(visible.length/2);const canvasWidth=1000,canvasHeight=Math.max(640,sideCount*150+70);const chosen=all.find(g=>g.id===active)||{id:'root'};const previousViewport=map.querySelector('.am-map');const oldLeft=previousViewport?.scrollLeft||0,oldTop=previousViewport?.scrollTop||0;
const lenses=['Lifecycle','Forgetting','April fit','Evaluation'];
map.innerHTML=`<header class="am-header"><div><div class="am-eyebrow">APRIL / MEMORY EXPLORATION</div><h1>What should April remember?</h1><p>Explore the map. Open details only when you need them.</p></div><div class="am-actions"><label class="am-workspace-control"><select aria-label="Choose workspace" data-am-workspace><option value="client-exploration.html" >Client experience</option><option value="agent-system-workspace.html" >Agent system</option><option value="memory-exploration.html" selected>Memory exploration</option></select></label><div class="am-mode-toggle" role="group" aria-label="Workspace view"><button data-am-mode="map" aria-pressed="${!editing}">Map</button><button data-am-mode="editor" aria-pressed="${editing}">Editor</button></div><button data-am-action="export">Export JSON</button><button data-am-action="import">Import JSON</button></div></header><div class="am-lenses" role="group" aria-label="Map lenses">${lenses.map(l=>`<button data-am-lens="${h(l)}" aria-pressed="${l===lens}">${h(l)}</button>`).join('')}<span class="am-map-controls" role="group" aria-label="Map zoom"><button data-am-zoom="out" aria-label="Zoom out">−</button><output aria-label="Zoom level">${Math.round(zoom*100)}%</output><button data-am-zoom="in" aria-label="Zoom in">+</button></span></div><div class="am-layout"><section class="am-map" aria-label="${h(lens)} mind map" tabindex="0"><div class="am-stage" style="width:${canvasWidth*zoom}px;height:${canvasHeight*zoom}px;transform:translate(calc(-50% + ${panX}px),calc(-50% + ${panY}px))"><div class="am-canvas" style="width:${canvasWidth}px;height:${canvasHeight}px;transform:scale(${zoom})"><svg viewBox="0 0 ${canvasWidth} ${canvasHeight}" preserveAspectRatio="none" aria-hidden="true">${visible.map((g,i)=>{const left=i<sideCount;const row=left?i:i-sideCount;const x=left?284:716,y=85+row*150;return `<path d="M ${left?390:610} ${canvasHeight/2} C ${left?330:670} ${canvasHeight/2} ${left?340:660} ${y} ${x} ${y}" fill="none" stroke="${active===g.id?'var(--maccent)':'var(--mline)'}" stroke-width="${active===g.id?2:1}"/>`}).join('')}</svg><button class="am-node am-center" style="left:390px;top:${canvasHeight/2-48}px;width:220px" data-am-node="root" aria-pressed="${active==='root'}"><small>APRIL</small><strong>${h(lens)}</strong><small>Memory research</small></button>${visible.map((g,i)=>`<button class="am-node" style="left:${i<sideCount?24:716}px;top:${40+(i<sideCount?i:i-sideCount)*150}px;width:260px" data-am-node="${h(g.id)}" aria-pressed="${g.id===active}"><span class="am-index">${String(i+1).padStart(2,'0')} / ${g.records.length} ${g.kind==='candidate'?'CHOICES':g.kind==='experiment'?'TEST':'RECORDS'}</span><strong>${h(g.title)}</strong><small>${h(g.caption)}</small></button>`).join('')}</div></div></section><aside class="am-inspector" aria-label="Selected branch details">${details(chosen)}</aside></div><footer class="am-footer"><span id="am-save">Edits save in this browser · export JSON to keep a portable copy.</span><span>1 November 2026 · documented behavior and April proposals distinguished</span></footer><input type="file" accept="application/json,.json" data-am-import-file hidden>`;
const viewport=map.querySelector('.am-map');if(needsFit){needsFit=false;panX=0;panY=0;zoom=Math.min(1,((viewport?.clientWidth||1000)-16)/canvasWidth,((viewport?.clientHeight||640)-16)/canvasHeight);draw();return}
}
map.addEventListener('click',e=>{if(suppressMapClick&&e.target.closest('.am-map')){e.preventDefault();e.stopImmediatePropagation();suppressMapClick=false;}},true);
map.addEventListener('pointerdown',e=>{const viewport=e.target.closest('.am-map');if(!viewport||editing||e.button!==0||e.isPrimary===false)return;dragState={id:e.pointerId,x:e.clientX,y:e.clientY,startX:panX,startY:panY,moved:false,viewport};});
map.addEventListener('pointermove',e=>{if(!dragState||dragState.id!==e.pointerId)return;const dx=e.clientX-dragState.x,dy=e.clientY-dragState.y;if(!dragState.moved&&Math.hypot(dx,dy)<5)return;if(!dragState.moved){dragState.moved=true;dragState.viewport.setPointerCapture(e.pointerId);dragState.viewport.classList.add('am-dragging');}e.preventDefault();panX=dragState.startX+dx;panY=dragState.startY+dy;dragState.viewport.querySelector('.am-stage').style.transform=`translate(calc(-50% + ${panX}px),calc(-50% + ${panY}px))`;});
function endMapDrag(e){if(!dragState||dragState.id!==e.pointerId)return;const d=dragState;dragState=null;d.viewport.classList.remove('am-dragging');if(d.viewport.hasPointerCapture(e.pointerId))d.viewport.releasePointerCapture(e.pointerId);if(d.moved){suppressMapClick=true;setTimeout(()=>{suppressMapClick=false},0);}}
map.addEventListener('pointerup',endMapDrag);map.addEventListener('pointercancel',endMapDrag);map.addEventListener('lostpointercapture',e=>{if(dragState&&dragState.id===e.pointerId)endMapDrag(e)});
map.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.amLens){lens=b.dataset.amLens;active='root';needsFit=true;draw()}if(b.dataset.amNode){active=b.dataset.amNode;draw()}if(b.dataset.amZoom){zoom=Math.max(.15,Math.min(2,zoom+(b.dataset.amZoom==='in'?.1:-.1)));needsFit=false;draw()}if(b.dataset.amAction==='editor'){editing=true;editorDraw();window.scrollTo(0,0)}if(b.dataset.amAction==='export'){const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='april-memory-exploration.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);map.querySelector('#am-save').textContent='Export downloaded. Browser edits remain saved locally.'}});
// Only wheel gestures inside the map affect zoom; keep the rendered DOM stable during the gesture.
map.addEventListener('wheel',e=>{const viewport=e.target.closest('.am-map');if(!viewport||editing||!e.deltaY)return;e.preventDefault();const unit=e.deltaMode===1?16:e.deltaMode===2?(viewport.clientHeight||640):1;const delta=Math.max(-100,Math.min(100,e.deltaY*unit));zoom=Math.max(.15,Math.min(2,zoom*Math.exp(-delta*.002)));needsFit=false;const canvas=viewport.querySelector('.am-canvas'),stage=viewport.querySelector('.am-stage');canvas.style.transform=`scale(${zoom})`;stage.style.width=`${parseFloat(canvas.style.width)*zoom}px`;stage.style.height=`${parseFloat(canvas.style.height)*zoom}px`;map.querySelector('output[aria-label="Zoom level"]').textContent=Math.round(zoom*100)+'%';},{passive:false});
map.addEventListener('input',e=>{const i=e.target.dataset.amRecord;if(i===undefined)return;const g=groups().find(g=>g.id===active);const r=g.records[Number(i)];const f=e.target.dataset.amField;if(f==='root-notes')data.notes=e.target.value;else r[f]=e.target.value;save();map.querySelector('#am-save').textContent='Saved in this browser · export JSON to preserve edits.';if(f==='status'){const d=e.target.closest('details');d.querySelector('.am-status').textContent=e.target.value}});
map.addEventListener('change',e=>{if(e.target.hasAttribute('data-am-workspace')){const next=e.target.value;if(['client-exploration.html','agent-system-workspace.html','memory-exploration.html'].includes(next)&&next!=='memory-exploration.html')location.href=next}});

map.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.amMode){editing=b.dataset.amMode==='editor';draw()}if(b.dataset.amSection){editSection=b.dataset.amSection;editIndex=0;editorDraw()}if(b.dataset.amAction==='map'){editing=false;draw()}if(b.dataset.amAction==='import')map.querySelector('[data-am-import-file]').click()});
map.addEventListener('input',e=>{const key=e.target.dataset.amEditField;if(!key)return;editRecords()[editIndex][key]=e.target.value;save();map.querySelector('#am-save').textContent='Saved in this browser · export JSON to preserve edits.'});
map.addEventListener('change',async e=>{if(e.target.hasAttribute('data-am-edit-select')){editIndex=Number(e.target.value);editorDraw()}if(e.target.hasAttribute('data-am-import-file')){try{const f=e.target.files[0];if(!f)return;if(f.size>5*1024*1024)throw Error('File too large');const incoming=JSON.parse(await f.text());if(client){if(!valid(incoming))throw Error('Invalid structure')}else validate(incoming);if(!confirm('Replace this workspace with the imported JSON? Export first to preserve current edits.'))return;data=incoming;editIndex=0;save();draw();map.querySelector('#am-save').textContent='Imported and saved in this browser.'}catch{map.querySelector('#am-save').textContent='Import rejected. Use a complete compatible workspace export.'}}});

back.onclick=()=>{original.hidden=true;map.hidden=false;back.hidden=true;draw();window.scrollTo(0,0)};
