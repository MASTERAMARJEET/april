<div id="april-experience-demo" aria-label="April interactive concept demo">
  <div class="ad-window">
    <header class="ad-top"><span class="ad-brand">april<span class="ad-dot"></span></span><span class="ad-caption">Interactive concept · simulated actions only</span><span class="ad-top-end">Personal vault</span></header>
    <div class="ad-desktop">
      <div class="ad-notch"><button class="ad-summon cursor-interaction" data-action="summon" aria-label="Simulate holding the activation key">Summon April</button></div>
      <div class="ad-session" aria-live="polite"></div>
      <div class="ad-layout">
        <aside class="ad-sidebar" aria-label="Vault navigation"><div class="ad-eyebrow">YOUR VAULTS</div><button class="ad-vault cursor-interaction" data-action="personal" aria-pressed="true">Personal <span>Open</span></button><button class="ad-vault cursor-interaction" data-action="private">Medical <span>Private</span></button><div class="ad-sidebar-rule"></div><div class="ad-eyebrow">ARTIFACTS</div><div class="ad-files"></div><div class="ad-sidebar-foot">Files you own.<br>One place to return to.</div></aside>
        <main class="ad-main"><nav class="ad-scenarios" aria-label="Demo scenarios"><button class="cursor-interaction" data-scenario="research" aria-pressed="true">Research</button><button class="cursor-interaction" data-scenario="coding" aria-pressed="false">Build a feature</button><button class="cursor-interaction" data-scenario="private" aria-pressed="false">Private task</button></nav><section class="ad-content"></section></main>
      </div>
      <div class="ad-approval" hidden></div>
    </div>
    <footer class="ad-bottom"><span class="ad-status" role="status">No microphone, accounts or files are accessed.</span><span>Design walkthrough · not a working agent</span></footer>
  </div>
</div>
<style>
#april-experience-demo{color-scheme:light dark;--ad-bg:light-dark(#f6f7f3,#121918);--ad-panel:light-dark(#ffffff,#192220);--ad-text:light-dark(#24372f,#e3ece7);--ad-muted:light-dark(#617168,#9daea5);--ad-border:light-dark(#d9e1da,#34443b);--ad-accent:light-dark(#215b41,#b2d9bf);--ad-selected:light-dark(#e7eee7,#293c30);font:14px/1.55 system-ui,-apple-system,sans-serif;color:var(--ad-text);width:100%}
#april-experience-demo *{box-sizing:border-box}#april-experience-demo [hidden]{display:none!important}#april-experience-demo button{font:inherit;color:var(--ad-text);background:var(--ad-panel);border:1px solid var(--ad-border);padding:8px 12px;border-radius:6px}#april-experience-demo button:hover{border-color:var(--ad-accent)}#april-experience-demo button[aria-pressed=true]{background:var(--ad-selected);color:var(--ad-accent)}#april-experience-demo button:disabled{opacity:.5}#april-experience-demo h1,#april-experience-demo h2,#april-experience-demo h3,#april-experience-demo p{margin:0}#april-experience-demo h1{font-size:25px;font-weight:500;line-height:1.25;letter-spacing:-.6px}#april-experience-demo h2{font-size:20px;font-weight:500;line-height:1.4}#april-experience-demo h3{font-size:14px;font-weight:500}#april-experience-demo p{margin-top:12px}#april-experience-demo .ad-window{background:var(--ad-bg);border:1px solid var(--ad-border);border-radius:12px;overflow:hidden}#april-experience-demo .ad-top{display:flex;align-items:center;gap:20px;padding:14px 20px;background:var(--ad-panel);border-bottom:1px solid var(--ad-border);flex-wrap:wrap}#april-experience-demo .ad-brand{font-size:20px;font-weight:500;letter-spacing:-.7px;display:flex;align-items:center;gap:7px}#april-experience-demo .ad-dot{width:6px;height:6px;border-radius:50%;background:var(--ad-accent)}#april-experience-demo .ad-caption,#april-experience-demo .ad-top-end{font-size:11px;color:var(--ad-muted)}#april-experience-demo .ad-top-end{margin-left:auto}#april-experience-demo .ad-desktop{position:relative}#april-experience-demo .ad-notch{display:flex;justify-content:center;padding:0 16px}#april-experience-demo .ad-summon{border-top:0;border-radius:0 0 16px 16px;min-width:200px;background:var(--ad-panel)}#april-experience-demo .ad-session{text-align:center;min-height:76px;padding:12px 20px;color:var(--ad-muted);font-size:12px}#april-experience-demo .ad-session strong{font-weight:500;color:var(--ad-text)}#april-experience-demo .ad-wave{display:inline-flex;align-items:center;gap:4px;height:20px;margin-right:8px;vertical-align:middle}#april-experience-demo .ad-wave i{display:block;width:3px;background:var(--ad-accent);border-radius:3px}#april-experience-demo .ad-layout{display:grid;grid-template-columns:180px minmax(0,1fr);min-height:455px;border-top:1px solid var(--ad-border)}#april-experience-demo .ad-sidebar{padding:20px 14px;border-right:1px solid var(--ad-border);display:flex;flex-direction:column;gap:8px}#april-experience-demo .ad-eyebrow{color:var(--ad-muted);font-size:10px;letter-spacing:.14em;margin-bottom:5px}#april-experience-demo .ad-vault{text-align:left;display:flex;justify-content:space-between;gap:8px}#april-experience-demo .ad-vault span{font-size:10px;color:var(--ad-muted);align-self:center}#april-experience-demo .ad-sidebar-rule{border-top:1px solid var(--ad-border);margin:12px 0}#april-experience-demo .ad-files{display:flex;flex-direction:column;gap:7px}#april-experience-demo .ad-files button{text-align:left;border-color:transparent;background:transparent;font-size:12px;overflow-wrap:anywhere;padding:7px 5px}#april-experience-demo .ad-files small{display:block;color:var(--ad-accent);font-size:10px}#april-experience-demo .ad-sidebar-foot{margin-top:auto;padding-top:25px;font-size:11px;color:var(--ad-muted)}#april-experience-demo .ad-main{padding:20px 26px 26px;min-width:0}#april-experience-demo .ad-scenarios{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:25px}#april-experience-demo .ad-scenarios button{font-size:12px;padding:6px 10px}#april-experience-demo .ad-content{max-width:650px}#april-experience-demo .ad-lead{color:var(--ad-muted);max-width:520px}#april-experience-demo .ad-quote{border-left:2px solid var(--ad-accent);padding:12px 16px;margin:20px 0;background:var(--ad-panel)}#april-experience-demo .ad-quote small{display:block;color:var(--ad-muted);font-size:10px;letter-spacing:.1em;margin-bottom:6px}#april-experience-demo .ad-primary{background:var(--ad-selected);border-color:var(--ad-accent);color:var(--ad-accent)}#april-experience-demo .ad-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}#april-experience-demo .ad-chip{display:inline-block;padding:3px 8px;border:1px solid var(--ad-border);border-radius:20px;font-size:11px;color:var(--ad-muted);margin-bottom:15px}#april-experience-demo .ad-path{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:18px 0;color:var(--ad-muted);font-size:11px}#april-experience-demo .ad-path span{padding:4px 7px;border-bottom:1px solid var(--ad-border)}#april-experience-demo .ad-path .ad-current{color:var(--ad-accent);border-color:var(--ad-accent)}#april-experience-demo details{margin-top:24px;border-top:1px solid var(--ad-border);padding-top:12px;color:var(--ad-muted);font-size:12px}#april-experience-demo summary{cursor:default;color:var(--ad-text)}#april-experience-demo .ad-artifact{margin-top:16px;padding:18px;border:1px solid var(--ad-border);background:var(--ad-panel);border-radius:8px}#april-experience-demo .ad-artifact p{font-size:13px;color:var(--ad-muted)}#april-experience-demo .ad-code{font:12px/1.7 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0;color:var(--ad-accent)}#april-experience-demo .ad-bottom{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--ad-border);padding:11px 18px;color:var(--ad-muted);font-size:10px}#april-experience-demo .ad-approval{position:absolute;inset:0;background:var(--ad-bg);padding:36px;display:flex;align-items:center;justify-content:center;z-index:3}#april-experience-demo .ad-approval-box{max-width:480px;width:100%;border:1px solid var(--ad-border);background:var(--ad-panel);padding:24px;border-radius:12px}#april-experience-demo dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:9px;margin:20px 0;font-size:12px}#april-experience-demo dt{color:var(--ad-muted)}#april-experience-demo dd{margin:0;overflow-wrap:anywhere}#april-experience-demo .ad-audit{font-size:11px;color:var(--ad-muted);margin-top:18px}
@media(max-width:600px){#april-experience-demo .ad-layout{grid-template-columns:1fr}#april-experience-demo .ad-sidebar{border-right:0;border-bottom:1px solid var(--ad-border);display:grid;grid-template-columns:1fr 1fr;padding:14px}#april-experience-demo .ad-sidebar .ad-eyebrow,#april-experience-demo .ad-sidebar-rule,#april-experience-demo .ad-sidebar-foot{display:none}#april-experience-demo .ad-files{grid-column:1/-1}#april-experience-demo .ad-main{padding:20px 16px}#april-experience-demo .ad-top-end{display:none}#april-experience-demo .ad-caption{margin-right:60px}#april-experience-demo .ad-approval{padding:16px;align-items:start}#april-experience-demo dl{grid-template-columns:85px minmax(0,1fr)}}
</style>
<script>
(()=>{
const root=document.getElementById('april-experience-demo');
const initial={scenario:'research',active:false,research:0,coding:0,private:0,grant:false,readResearch:false,readCode:false,artifact:null,audit:[]};
let state={...initial,audit:[]};
const saved=window.openai?.widgetState?.privateContent;
if(saved&&saved.version===1&&['research','coding','private'].includes(saved.state?.scenario))state={...initial,...saved.state,audit:Array.isArray(saved.state.audit)?saved.state.audit:[]};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const action=(id,text,primary=false)=>`<button class="cursor-interaction ${primary?'ad-primary':''}" data-action="${id}">${text}</button>`;
const path=(labels,index)=>'<div class="ad-path">'+labels.map((s,i)=>`<span class="${i<=index?'ad-current':''}">${s}</span>${i<labels.length-1?' → ':''}`).join('')+'</div>';
const behind=text=>`<details><summary>Behind this step</summary><p>${text}</p></details>`;
function persist(){const api=window.openai;if(api?.setWidgetState)api.setWidgetState({modelContent:{demoScenario:state.scenario,researchStage:state.research,codingStage:state.coding,privateStage:state.private},privateContent:{version:1,state}}).catch(()=>{});}
function render(){
 root.querySelector('.ad-summon').textContent=state.active?'April is active · dismiss':'Summon April';
 const wave='<span class="ad-wave" aria-hidden="true">'+[6,14,20,10,16,7].map(h=>`<i style="height:${h}px"></i>`).join('')+'</span>';
 root.querySelector('.ad-session').innerHTML=state.active?wave+'<strong>Listening</strong> · choose a sample request below':'Hold your configured key in the real app.<br>Here, click Summon April to simulate activation.';
 root.querySelectorAll('[data-scenario]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scenario===state.scenario)));
 root.querySelector('.ad-files').innerHTML=(state.research>=2?`<button class="cursor-interaction" data-action="open-research">Eventual consistency.md<small>${state.readResearch?'Research artifact':'New · unread'}</small></button>`:'<span class="ad-caption">Artifacts appear here.</span>')+(state.coding>=3?`<button class="cursor-interaction" data-action="open-code">Feature preview<small>${state.readCode?'Development artifact':'New · unread'}</small></button>`:'');
 let content='';
 if(!state.active&&!state.artifact){content='<span class="ad-chip">A day with April</span><h1>Speak once.<br>Keep moving.</h1><p class="ad-lead">Research, coding and private tasks come back to one workspace. Try a sample request after summoning April.</p><div class="ad-actions">'+action('summon','Summon April',true)+'</div>'+behind('The planned Mac client handles voice and native device integration. Cloud agents keep their own task state; closing a workspace is not the same as cancelling work. This demo uses no real microphone.');}
 else if(state.artifact==='research'){content='<span class="ad-chip">Personal / Knowledge · sample content</span><h1>Eventual consistency</h1><div class="ad-artifact"><h3>The short version</h3><p>Different replicas may briefly disagree. If updates stop and communication succeeds, replicas eventually converge.</p><p>For April: a local edit should not silently disappear just because the cloud has a newer version. Conflicting edits are preserved for your resolution.</p></div><p class="ad-lead">You opened this when convenient. April did not wait for you to read it before continuing unrelated work.</p><div class="ad-actions">'+action('return','Return to conversation')+'</div>'+behind('A research specialist would produce an artifact with sources and provenance. The text here is illustrative, not a live research result. The planned vault sync engine is not implemented in this demo.');}
 else if(state.artifact==='code'){content='<span class="ad-chip">Development preview · simulated</span><h1>Vault search</h1><div class="ad-artifact"><label>Try the sample search<input data-demo-search aria-label="Search sample vault files" placeholder="Type meeting or research" style="display:block;width:100%;margin-top:10px;padding:9px;font:inherit;color:var(--ad-text);background:var(--ad-bg);border:1px solid var(--ad-border);border-radius:5px"></label><p class="ad-search-results">Meeting notes.md · Research guide.md · Project plan.md</p></div><div class="ad-actions">'+action('return','Return to feature review')+'</div>'+behind('This is a small working local interaction inside a fictional development preview. No repository, cloud deployment or GitHub pull request has been created.');}
 else if(state.scenario==='research'){
  content='<span class="ad-chip">Research specialist</span><h1>A question becomes an artifact.</h1>';
  if(state.research===0)content+='<div class="ad-quote"><small>SAMPLE VOICE REQUEST</small>Explain eventual consistency, and save a short guide in my personal vault.</div><div class="ad-actions">'+action('research-start','Ask April',true)+'</div>';
  if(state.research===1)content+=path(['Requested','Research','Artifact'],1)+'<p>April delegates the question and keeps the task moving in the background.</p><div class="ad-actions">'+action('research-finish','Simulate research result',true)+action('go-coding','Start another task')+'</div>';
  if(state.research>=2)content+=path(['Requested','Research','Artifact'],2)+'<p>A new guide is ready in your vault. Read it now or leave it unread while you continue.</p><div class="ad-actions">'+action('open-research','Open the guide',true)+action('go-coding','Ask for a feature')+'</div>';
  content+=behind('One interaction agent delegates to a specialist. A durable task and an artifact are separate from the voice session. Unread artifacts are not approval requests and do not block subsequent authorized work.');
 }
 else if(state.scenario==='coding'){
  content='<span class="ad-chip">Coding specialist · April’s own repository</span><h1>Help April build its next capability.</h1>'+path(['Discuss','Build','Dev preview','PR review','Production'],Math.max(0,state.coding-1));
  if(state.coding===0)content+='<div class="ad-quote"><small>SAMPLE REQUEST</small>Add search to the vault browser.</div><p>This is substantial feature work. April clarifies the scope before implementing.</p><div class="ad-actions">'+action('code-plan','Discuss the feature',true)+'</div>';
  if(state.coding===1)content+='<div class="ad-artifact"><h3>Proposed scope</h3><p>Search file names in the active vault. Respect vault access. Show results without blocking voice. No cross-vault search in this change.</p></div><div class="ad-actions">'+action('code-build','Approve this plan',true)+'</div>';
  if(state.coding===2)content+='<p>April’s coding specialist would build and test in Cloudflare, then return a development preview and review evidence.</p><div class="ad-actions">'+action('code-preview','Simulate build and preview',true)+'</div>';
  if(state.coding===3)content+='<p>The development preview is ready. Production has not changed.</p><div class="ad-actions">'+action('open-code','Try the preview',true)+action('code-review','Review the sample PR')+'</div>';
  if(state.coding===4)content+='<div class="ad-artifact"><h3>Sample pull request · vault search</h3><div class="ad-code">+ Active-vault file-name search\n+ Private-vault access boundary\n+ Search and empty-result checks</div><p>Simulated evidence: sample checks completed. No real tests or deployment have run.</p></div><div class="ad-actions">'+action('release-request','Review production approval',true)+'</div>';
  if(state.coding===5)content+='<p>Production release approved in this simulation. The feature task is complete, with a review record.</p><div class="ad-actions">'+action('go-private','Explore a private task',true)+'</div>';
  content+=behind('The initial workflow is discussion → scoped coding task → development preview → GitHub PR → user approval → production. Independent verification and release authority remain separate from the code-writing specialist.');
 }
 else {
  content='<span class="ad-chip">Central approval agent</span><h1>Permission belongs to the task.</h1>';
  if(state.private===0)content+='<div class="ad-quote"><small>FICTIONAL SAMPLE REQUEST</small>Use my private visit notes to make a follow-up checklist.</div><p>The vault may already be synced to encrypted cloud storage. That does not grant the agent access.</p><div class="ad-actions">'+action('private-request','Request private access',true)+'</div>';
  if(state.private===1)content+='<p>You declined access. The private task is waiting; April can continue unrelated authorized work.</p><div class="ad-actions">'+action('private-request','Review request again',true)+action('go-research','Continue research')+'</div>';
  if(state.private===2)content+='<p>Access is granted only for this sample task. The private source is excluded from ordinary memory.</p><div class="ad-actions">'+action('private-finish','Simulate task completion',true)+'</div>';
  if(state.private===3)content+='<div class="ad-artifact"><h3>Follow-up checklist · fictional example</h3><p>Review the notes and prepare the questions you want to discuss. No real medical data was accessed.</p></div><p>Task complete. The private-vault grant has expired.</p><div class="ad-actions">'+action('go-research','Return to ordinary work',true)+'</div>';
  content+=behind('All permission requests route through a central approval agent/service. The scope is shown in a UI, approval is an explicit click, and the event is logged. Speech is not private-access consent. Expiry is tied to task completion; key management and enforcement are still engineering design work.');
 }
 root.querySelector('.ad-content').innerHTML=content;
 root.querySelector('.ad-status').textContent=state.grant?'Simulated grant active · one private task':state.private===3?'Simulated grant expired · task ended':'No microphone, accounts or files are accessed.';
}
let pending=null;
function showApproval(type){pending=type;const privateTask=type==='private';const overlay=root.querySelector('.ad-approval');overlay.hidden=false;overlay.innerHTML='<div class="ad-approval-box" role="dialog" aria-modal="true" aria-label="'+(privateTask?'Private access approval':'Production release approval')+'"><div class="ad-eyebrow">CENTRAL APPROVAL AGENT · SIMULATION</div><h2>'+(privateTask?'Allow this private task?':'Approve this release?')+'</h2><dl><dt>Request</dt><dd>'+(privateTask?'Create a follow-up checklist':'Release reviewed vault search')+'</dd><dt>Scope</dt><dd>'+(privateTask?'Medical / visit-notes.md · fictional':'Sample reviewed change only')+'</dd><dt>Operation</dt><dd>'+(privateTask?'Read for this task':'Promote development candidate')+'</dd><dt>Limit</dt><dd>'+(privateTask?'Expires when this task ends. No ordinary memory retention.':'No permission to change release policy.')+'</dd></dl><div class="ad-actions">'+action('approve',privateTask?'Approve task access':'Approve sample release',true)+action('deny','Decline')+'</div><p class="ad-audit">Your click creates a local simulated audit event. Nothing is sent to a server.</p></div>';overlay.querySelector('[data-action="approve"]').focus();}
function closeApproval(){root.querySelector('.ad-approval').hidden=true;pending=null;}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!root.contains(b))return;if(b.dataset.scenario){state.scenario=b.dataset.scenario;state.artifact=null;render();persist();return;}const id=b.dataset.action;if(!id)return;
 if(id==='summon'){state.active=!state.active;state.artifact=null;}
 if(id==='personal'){state.artifact=null;}
 if(id==='private'){state.scenario='private';state.artifact=null;state.active=true;}
 if(id==='research-start')state.research=1;
 if(id==='research-finish')state.research=2;
 if(id==='go-research'){state.scenario='research';state.artifact=null;}
 if(id==='go-coding'){state.scenario='coding';state.artifact=null;}
 if(id==='go-private'){state.scenario='private';state.artifact=null;}
 if(id==='open-research'){state.artifact='research';state.readResearch=true;}
 if(id==='open-code'){state.artifact='code';state.readCode=true;}
 if(id==='return')state.artifact=null;
 if(id==='code-plan')state.coding=1;
 if(id==='code-build'){state.coding=2;state.audit.push('Feature plan approved');}
 if(id==='code-preview')state.coding=3;
 if(id==='code-review')state.coding=4;
 if(id==='private-request'){showApproval('private');return;}
 if(id==='release-request'){showApproval('release');return;}
 if(id==='approve'||id==='deny'){const type=pending;if(!type)return;state.audit.push((id==='approve'?'Approved ':'Declined ')+type);if(type==='private'){state.grant=id==='approve';state.private=id==='approve'?2:1;}else if(id==='approve')state.coding=5;closeApproval();}
 if(id==='private-finish'){state.private=3;state.grant=false;state.audit.push('Private grant expired at task completion');}
 render();persist();
});
root.addEventListener('input',e=>{if(!e.target.hasAttribute('data-demo-search'))return;const query=e.target.value.toLowerCase();const files=['Meeting notes.md','Research guide.md','Project plan.md'].filter(s=>s.toLowerCase().includes(query));root.querySelector('.ad-search-results').textContent=files.length?files.join(' · '):'No matching files in this sample vault.';});
root.addEventListener('keydown',e=>{if(e.key==='Escape'&&pending){closeApproval();root.querySelector('.ad-scenarios button[aria-pressed="true"]').focus();}});
window.addEventListener('openai:set_globals',e=>{const v=e.detail?.globals?.widgetState?.privateContent;if(v?.version===1&&['research','coding','private'].includes(v.state?.scenario)){state={...initial,...v.state,audit:Array.isArray(v.state.audit)?v.state.audit:[]};render();}});
render();
})();
</script>
