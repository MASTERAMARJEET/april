<style>
:root{--bg:#f6f5f0;--panel:#fffefb;--ink:#242d2a;--muted:#69736d;--line:#dddeda;--accent:#245e4b;--wash:#e6eee8;--soft:#eeeee7;--warn:#77562b;--radius:10px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button,a,input,textarea,select{outline-offset:3px}button{cursor:pointer;border:1px solid var(--line);border-radius:6px;padding:8px 12px;background:var(--panel);color:var(--ink)}button:hover{border-color:var(--accent);background:var(--wash)}button.primary{background:var(--accent);color:white;border-color:var(--accent)}a{color:var(--accent)}input,textarea,select{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:10px}textarea{resize:vertical;min-height:108px;line-height:1.6}input:focus,textarea:focus,select:focus{outline:2px solid var(--accent)}label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px}h1,h2,h3,p{margin-top:0}h1{font-size:30px;line-height:1.2;letter-spacing:-.8px;font-weight:650}h2{font-size:20px;letter-spacing:-.3px}h3{font-size:15px}.app{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:100vh}.sidebar{padding:28px 18px;border-right:1px solid var(--line);background:var(--panel);position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.brand{font-size:18px;font-weight:650;letter-spacing:-.5px;padding:0 12px}.eyebrow{text-transform:uppercase;font-size:10px;letter-spacing:1.6px;font-weight:650;color:var(--muted)}.sidebar .eyebrow{padding:3px 12px 24px}nav{display:grid;gap:5px}nav button{border:0;text-align:left;background:none;padding:11px 12px;color:var(--muted);display:flex;justify-content:space-between}nav button.active{background:var(--wash);color:var(--accent);font-weight:650}.side-bottom{margin-top:auto;font-size:11px;color:var(--muted);padding:15px 12px 0}.dot{display:inline-block;width:6px;height:6px;border-radius:100%;background:var(--accent);margin-right:6px}.toolbar{border-bottom:1px solid var(--line);padding:13px 32px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:65px}.toolbar .actions{display:flex;gap:7px}.toolbar button{padding:6px 10px;font-size:12px}.toolbar small{color:var(--muted)}main{padding:36px 40px 70px;max-width:1360px;margin:auto}.heading{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:25px}.subtitle{max-width:740px;color:var(--muted);font-size:15px}.tag{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:3px 9px;font-size:11px;white-space:nowrap;color:var(--muted)}.tag.accent{background:var(--wash);border-color:var(--wash);color:var(--accent)}.split{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px}.panel{padding:23px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}.field{margin-bottom:20px}.field:last-child{margin-bottom:0}.section{margin-top:32px}.muted{color:var(--muted)}.small{font-size:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.rule{height:1px;background:var(--line);margin:24px 0}.callout{padding:14px 17px;border-left:3px solid var(--accent);background:var(--wash);font-size:13px}.flow{padding:24px 0}.flow-root{width:min(100%,470px);margin:auto;display:block;text-align:center;padding:20px;border-color:var(--accent)}.flow-root strong{display:block;font-size:19px}.flow-root span{font-size:12px;color:var(--muted)}.connector{text-align:center;color:var(--muted);font-size:12px;padding:13px}.specialists{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.specialists button{text-align:left;min-height:100px;padding:15px}.specialists strong{display:block;margin:5px 0}.specialists span{font-size:11px;color:var(--muted)}.infrastructure{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;background:var(--soft);padding:16px;border-radius:6px}.pipeline{display:flex;gap:0;margin:18px 0 0;flex-wrap:wrap}.pipeline span{padding:8px 14px;background:var(--panel);border:1px solid var(--line);font-size:12px}.pipeline span+span:before{content:'→';color:var(--muted);margin-right:13px}.stats{display:flex;gap:30px;flex-wrap:wrap;padding:0 0 24px}.stat strong{display:block;font-size:25px;font-weight:550}.stat span{font-size:11px;color:var(--muted)}.catalog{display:grid;grid-template-columns:285px minmax(0,1fr);gap:24px}.list{display:grid;gap:6px;align-content:start}.list button{text-align:left;padding:13px 14px;background:transparent;border-color:transparent}.list button.selected{background:var(--panel);border-color:var(--line)}.list button strong{display:block}.list button span{font-size:11px;color:var(--muted)}.detail-head{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px}.detail-head select{max-width:145px}.detail-head h2{margin:0}.detail-fields{display:grid;grid-template-columns:1fr 1fr;gap:20px}.detail-fields .field{margin:0}.detail-fields textarea{min-height:145px}.full{grid-column:1/-1}.search{margin-bottom:13px}.platform-row{padding:19px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:210px minmax(0,1fr) 100px;gap:22px;align-items:start}.platform-row h3{margin-bottom:3px}.platform-row p{margin-bottom:5px}.platform-row button{font-size:12px}.decision{padding:20px 0;border-bottom:1px solid var(--line)}.decision summary{cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:20px;font-weight:600;list-style:none}.decision summary:before{content:'+';color:var(--accent)}.decision[open] summary:before{content:'−'}.decision summary .title{flex:1}.decision .body{padding:18px 0 0 24px}.decision .detail-fields textarea{min-height:100px}.phase{margin-top:26px}.phase h3{color:var(--accent);margin-bottom:6px}.task{display:grid;grid-template-columns:1fr 130px 36px;gap:15px;padding:13px 0;border-bottom:1px solid var(--line);align-items:center}.task input{border-color:transparent;background:transparent;padding:3px 0}.task input:focus{background:var(--panel)}.task select{padding:6px;font-size:12px}.task button{padding:5px}.task p{margin:3px 0 0;font-size:12px;color:var(--muted)}.idea{margin:18px 0;padding:20px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}.idea input{font-weight:600}.idea textarea{margin-top:10px}.source{padding:12px 0;border-bottom:1px solid var(--line)}.modal-wrap{position:fixed;inset:0;background:rgba(15,25,20,.4);display:flex;justify-content:center;align-items:center;padding:25px;z-index:10}.modal{background:var(--bg);border-radius:12px;padding:28px;width:min(720px,100%);max-height:88vh;overflow:auto}.modal textarea{min-height:140px}.modal .row{margin-top:22px}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 20px;border:1px solid var(--line);border-radius:7px;background:var(--ink);color:var(--panel);z-index:20;max-width:85vw;font-size:13px}button:disabled{opacity:.5;cursor:default}.noscript{padding:30px}.checkpoint{font-size:11px;color:var(--warn)}.mobile-brand{display:none}.footer{margin-top:34px;font-size:11px;color:var(--muted)}
@media(max-width:1000px){.specialists{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.app{grid-template-columns:195px minmax(0,1fr)}main{padding:28px 24px}.toolbar{padding:12px 24px}.catalog{grid-template-columns:220px minmax(0,1fr)}.detail-fields{grid-template-columns:1fr}.platform-row{grid-template-columns:170px minmax(0,1fr)}.platform-row>button{grid-column:2}.full{grid-column:auto}}

<script>
'use strict';
const SEED={"schemaVersion": 1, "title": "Personal Agent System", "updatedAt": "2026-10-31", "vision": "One interaction agent, available across my devices and eventually my apps, that understands my intent and delegates to specialized agents. Specialists carry deep capabilities while the main agent keeps me informed. The system should manage real projects with bounded autonomy, protect my personal data, and improve over time. Voice-first interaction surfaces artifacts and interactive interfaces rather than centering chat. Build a platform-agnostic core; start with Mac, then web, then native Android. Deliver one unified April application with an Obsidian-inspired vault workspace, user-owned artifact folders and a focus-preserving voice overlay on the active screen.", "principles": "One relationship, many specialists.\nDelegate outcomes with explicit scope, not unrestricted access.\nPersist useful knowledge; discard untrusted execution environments.\nSeparate facts, inferences, preferences, and authorization.\nProtect originals; make changes reversible where possible.\nVerify independently before consequential release.\nKeep data, contracts, and model choice portable.\nTreat autonomy as a policy, not an absence of safeguards.", "success": "I can request a useful outcome from any device, leave, and return to a trustworthy result. I receive evidence and concise updates without approving every tool action. Personal knowledge and artifacts become easier to find, correct, and understand. The platform improves without silently widening its own authority.", "agents": [{"id": "main", "name": "Interaction agent", "category": "Coordinator", "status": "Concept", "purpose": "One familiar agent across my devices and, eventually, the apps I use. It understands intent, delegates work, and brings results back in the right level of detail.", "responsibilities": "Maintain conversational continuity across channels.\nClarify outcomes, not every implementation step.\nCreate scoped tasks for specialists and follow them to completion.\nReconcile conflicting results and surface consequential exceptions.\nRemember preferences with provenance and allow correction.", "inputs": "Messages, voice, notifications, user preferences, specialist updates, project state.", "outputs": "Answers, plans, delegated jobs, concise progress reports, exception requests, durable decisions.", "tools": "Conversation interface; task registry; specialist dispatch; memory search; scheduler; notification service.", "permissions": "Read approved shared summaries. Dispatch only registered task types within policy. Ask for exceptions when a requested action exceeds policy.", "boundaries": "Do not inherit every specialist credential.\nDo not treat retrieved documents or tool output as user authorization.\nDo not send unrelated personal context to a specialist.\nA channel login does not automatically authorize sensitive actions.", "questions": "What hold and double-press thresholds feel right?\nHow does an active session move when work changes monitors?\nWhat is the precise vault workspace layout and library stack?\nHow are private grants scoped, expired, revoked and removed from derived context?\nHow do local vault files reconcile with cloud-authoritative state?\nWhich realtime voice behaviors are mandatory versus optional?\nWhat is the smallest coding bootstrap and first native capability?", "firstMilestone": "Mac-only voice-first conversation. Chat is secondary and queues requests while offline.", "notes": "\nVoice-first surfaces: Voice is primary, activated by a button or wake word; exact activation defaults remain open. Chat is secondary. Surface background results as artifacts, websites and interactive interfaces for input and action.\nContext-aware notifications: Choose delivery using priority, need for user action, active device and work/social context exposed by devices. Signal sources, permissions and interruption thresholds remain open; continuous surveillance is not implied.\nAdjustable autonomy and learned approval: Start restrictive and ask more often early. User can tighten or relax guardrails. Explore an approver model learning from approvals and denials, approving suitable actions within delegated authority and flagging exceptions. Rule promotion and fixed boundaries remain open.\nSensitive memory exception: Keep financial and medical information separate from ordinary memory. Explicit user tagging or requests grant provisional access for a specific task. General retention and unrelated reuse are not authorized. Storage, expiry, revocation and derived-data cleanup remain open.\nUnified April application: Keep voice, vault browser, previews and interactive artifacts in one April application. Obsidian is a UX reference; a required separate Obsidian host is ruled out. Reuse libraries; GUI framework and core language remain open.\nMac voice activation and focus: Hold a configurable key to activate an ongoing voice session; release does not end it. Dismiss by spoken request or double-press. Preserve keyboard focus in the current app. Timing and failure behavior remain open.\nNotch and multi-monitor presence: Listening and speaking have distinct wave/blob states. On notched displays emerge from the notch. On non-notched displays stay invisible until activated, then show a top-center indicator below the menu bar. Appear on the screen the user is actively working on, including external monitors.\nUser-owned multi-vault artifacts: User chooses artifact folder locations. Provide a default vault and additional vaults, with an Obsidian-style file/folder browser and tabbed artifacts. Cross-context accessible vaults may be consulted from other active vaults; this is not internet publication.\nPrivate vault grants: Private-vault information requires explicit, specific, temporary access that expires. Financial/medical information remains excluded from ordinary memory. Grant duration, operations, revocation and derived-context cleanup remain open.\nNon-blocking artifact browsing: Indicate new and edited artifacts in the vault browser. User can inspect now or later; unread items do not block subsequent work. Actual required user input or approval may block dependent work.\nArtifact types and preview scope: Support Markdown, DOCX previews, JavaScript source and interactive artifacts within April. Full Word editing is not initially required. Interactive execution needs an isolated surface; library and rendering choices remain open.\nReplaceable realtime voice provider: Start with OpenAI realtime voice, with natural spoken interruption and a replaceable provider layer preserving required behaviors. Review official capabilities before design; cross-provider feature equivalence is unproven. Wake-word investigation is deferred.", "dependencies": "Shared identity, job protocol, scoped permissions, audit trail"}, {"id": "coding", "name": "Coding agent", "category": "Builder", "status": "Concept", "purpose": "Improve my coding projects and the agent system itself with substantial autonomy inside a disposable development environment.", "responsibilities": "Turn scoped objectives into patches.\nBuild, test, debug, and inspect browser behavior.\nMaintain project knowledge and dependency hygiene.\nReturn evidence, limitations, and a reproducible change.\nPropose improvements to the agent platform without controlling its release policy.", "inputs": "Repository + exact commit; selected work-in-progress patch; task brief; acceptance criteria; allowed services; budget.", "outputs": "Patch or branch; test evidence; browser screenshots; implementation summary; unresolved risks.", "tools": "Pi CLI; Cloudflare Linux sandbox; Browser Run; scoped repository broker; package registries.", "permissions": "Autonomous commands and edits inside one task sandbox. Write candidate branches through a broker. No direct production deployment.", "boundaries": "No production secrets or broad cloud token.\nCannot change external verification, permission, or release policies.\nFresh verification runs outside the coding sandbox.\nSelf-modification must pass a separate release path; no editing the running coordinator.", "questions": "Which stacks need Docker networking or larger disks?\nWhich changes qualify for automatic merge?\nHow do we test the agent system before promoting a new version?\nHow many repair attempts are allowed?", "firstMilestone": "Implement a small change in one low-risk repository, run checks, and return a patch and preview.", "notes": "\nInitial self-extension flow: discuss substantial features first; user decides readiness. Implement/test and deploy to dev; open PR with artifacts; user approval before production.\nApril repositories only, hosted/reviewed on GitHub; builds and tests on Cloudflare. Other projects are added later.", "dependencies": "Shared identity, job protocol, scoped permissions, audit trail"}, {"id": "research", "name": "Research & wiki agent", "category": "Knowledge", "status": "Concept", "purpose": "Maintain a personal wiki that helps me learn topics at different depths, with sources, connections, and a clear distinction between evidence and interpretation.", "responsibilities": "Research questions and compare credible sources.\nWrite brief, practical, and deep explanations of the same topic.\nMaintain linked topic pages, glossaries, and learning paths.\nRevisit stale claims and record corrections.\nTrack what I know, want to learn, and have questioned.", "inputs": "Questions; learning goals; approved reading history; existing wiki; source material.", "outputs": "Cited wiki pages; learning paths; short briefings; source records; uncertainty and freshness notes.", "tools": "Exa or other search; document extraction; wiki store; citations; optional retrieval index.", "permissions": "Search public sources and draft or update approved wiki areas with revision history. Notify on significant corrections.", "boundaries": "External source text is evidence, not instructions.\nRetain URLs, retrieval dates, and claim provenance.\nDo not silently rewrite user-authored beliefs as facts.\nRespect source licenses; avoid retaining unnecessary private material.", "questions": "Where should the wiki live and how should it export?\nWhich depth levels work best for me?\nWhen should topics refresh?\nHow are contradictory sources represented?", "firstMilestone": "One topic with a two-minute overview, practical guide, deep dive, source list, and linked questions.", "notes": "", "dependencies": "Shared identity, job protocol, scoped permissions, audit trail"}, {"id": "artifacts", "name": "Digital artifacts agent", "category": "Personal data", "status": "Concept", "purpose": "Organize my photos, documents, and other digital artifacts while preserving originals and keeping identity and location inferences reviewable.", "responsibilities": "Index approved libraries and find duplicates.\nGroup photos by time, place, event, and known people.\nConnect artifacts to meetings, projects, and trips.\nPropose organization and record every change.\nSupport corrections and deletion across derived metadata.", "inputs": "Selected photo/document libraries; EXIF; approved location history; user-confirmed people labels.", "outputs": "Searchable catalog; proposed albums and tags; duplicate candidates; provenance; reversible organization plans.", "tools": "Read-scoped connectors; object storage; metadata database; image analysis; geospatial enrichment.", "permissions": "Start read-only. Add reversible metadata and organization only after policy is set. Destructive deduplication remains a separate permission.", "boundaries": "Preserve original media.\nPeople tags and locations are sensitive; inferred matches need confidence and correction.\nUse confirmed person IDs rather than inventing identities.\nDo not upload an entire library to model providers by default.\nSeparate deletion of originals from deletion of indexes.", "questions": "Where are originals today?\nMay image content leave my storage boundary?\nWhat retention applies to embeddings and face-derived data?\nWhat can be automatically tagged versus confirmed?", "firstMilestone": "Read-only index of a small chosen album, with duplicate suggestions and reversible event tags.", "notes": "", "dependencies": "Shared identity, job protocol, scoped permissions, audit trail"}, {"id": "recording", "name": "Recording & notes agent", "category": "Capture", "status": "Concept", "purpose": "Capture meetings, talks, and selected in-person conversations, turning them into useful notes and follow-ups with clear recording controls.", "responsibilities": "Start and stop only through explicit authorized capture.\nTranscribe, label speakers provisionally, and summarize.\nExtract decisions, action items, and unresolved questions.\nLink approved notes to people, projects, and wiki topics.\nLet me correct transcripts and delete recordings.", "inputs": "Explicitly selected microphone stream, meeting recording, video, or audio file; event context.", "outputs": "Transcript with timestamps; summary; action items; references; retention and consent record.", "tools": "Device capture client; upload/streaming; speech-to-text; diarization; notes store; notification tools.", "permissions": "Capture only authorized sessions. Draft action items; creating calendar events or sending messages uses separate permissions.", "boundaries": "Visible recording state and immediate stop control.\nDefine consent and applicable recording requirements for each setting.\nNo silent always-listening default.\nSpeaker labels are provisional until confirmed.\nDo not store audio indefinitely without a chosen retention policy.", "questions": "Which device performs capture?\nWhich meeting apps and languages matter?\nCan transcription be local?\nHow long do raw audio and transcripts persist?\nWhen can notes be shared?", "firstMilestone": "Upload one authorized recording and return timestamped notes with editable actions.", "notes": "", "dependencies": "Shared identity, job protocol, scoped permissions, audit trail"}, {"id": "verifier", "name": "Verification agent", "category": "Quality", "status": "Concept", "purpose": "Independently evaluate whether a specialist output meets the requested outcome, using evidence rather than the worker\u2019s success claim.", "responsibilities": "Run trusted acceptance checks in a fresh environment.\nInspect protected changes, regressions, and source quality.\nCompare outputs against task criteria.\nReturn an evidence-based pass, fail, or needs-attention result.", "inputs": "Immutable candidate artifact; original task contract; trusted check definitions; scoped test data.", "outputs": "Verification report tied to exact artifact/commit; failures; evidence; recommendation.", "tools": "Fresh sandbox; browser checks; policy engine; trusted check store; optional separate model.", "permissions": "Read candidate artifacts and execute checks. Cannot grant itself release authority or rewrite mandatory checks.", "boundaries": "Candidate code remains untrusted during verification.\nNo production secrets in test processes.\nModel review is a signal, not a correctness guarantee.\nChecks and policy must be outside candidate-editable scope.", "questions": "What checks are mandatory for each project?\nWhen do we use a second model?\nWhat failures warrant repair versus escalation?", "firstMilestone": "Verify the first coding patch independently and reject a deliberately failing fixture.", "notes": "", "dependencies": "Shared identity, job protocol, scoped permissions, audit trail"}, {"id": "release", "name": "Release service", "category": "Control", "status": "Concept", "purpose": "Promote verified changes under explicit project policy, with staged deployment, health checks, and recovery.", "responsibilities": "Match approval evidence to the exact artifact.\nMerge eligible changes and deploy through scoped APIs.\nMonitor rollout health and trigger defined rollback.\nKeep release and policy-change records.", "inputs": "Verified artifact; signed/authoritative job record; project release policy; environment.", "outputs": "Release record; deployment link; health outcome; rollback result.", "tools": "Trusted deterministic service; deployment APIs; monitoring; backups.", "permissions": "Only narrowly defined release operations. Prefer deterministic policy evaluation over open-ended model authority.", "boundaries": "Not a general-purpose agent with a production shell.\nNo untrusted build script executes with deployment credentials.\nDatabase rollback requires a separate plan.\nPolicy edits require an external authorization path.", "questions": "Which environments can deploy automatically?\nWhat is the rollback trigger?\nHow do we promote updates to the agent system itself?", "firstMilestone": "Deploy one verified low-risk artifact to preview and record health evidence.", "notes": "", "dependencies": "Shared identity, job protocol, scoped permissions, audit trail"}, {"id": "operations", "name": "Personal operations agent", "category": "Future", "status": "Concept", "purpose": "Help with calendars, reminders, inbox triage, and routine personal administration after a permission model exists.", "responsibilities": "Summarize commitments.\nDraft scheduling and communication actions.\nTrack follow-ups and recurring tasks.", "inputs": "Explicitly connected calendar, email, tasks, and user instructions.", "outputs": "Draft actions; reminders; schedules; completion reports.", "tools": "Scoped connectors; scheduler; notification channels.", "permissions": "Start with read and draft. Separate sending, booking, buying, deleting, and sharing permissions.", "boundaries": "No blanket permission to contact people or spend money.\nPreview consequential actions and record authorization.", "questions": "Which apps first?\nWhich actions can be delegated permanently?\nHow are conflicting calendars reconciled?", "firstMilestone": "Read one approved calendar and produce a private daily briefing.", "notes": "", "dependencies": "Shared identity, job protocol, scoped permissions, audit trail"}, {"id": "approval", "name": "Approval agent", "category": "Authority", "status": "Concept", "purpose": "Centralize all approval requests, user-facing consent and auditable scoped grants.", "responsibilities": "Receive requests from April and specialists. Present scope in an overlay. Record explicit decisions and expiry. Apply user-defined policy and escalate exceptions.", "inputs": "Task, requester, resource/item scope, operations, purpose, policy and requested duration.", "outputs": "Auditable approval/denial and narrowly scoped grant or escalation.", "tools": "Trusted approval overlay, policy store, grant service and audit log; exact implementation open.", "permissions": "Coordinate approval within user-granted policy; cannot override mandatory explicit private-vault consent.", "boundaries": "No voice-derived private consent. Requesters cannot self-approve or bypass the service. Enforce grants outside the model.", "questions": "Grant lifetime? Key custody? Trusted click provenance? Revocation and derived-context cleanup?", "firstMilestone": "Show one private-vault request with scope; record explicit button decision and enforce an expiring grant.", "notes": "Learned approval is an earlier aspiration; explicit private-vault consent remains mandatory.", "dependencies": "User identity, task scope, trusted UI, policy enforcement and audit storage"}], "platform": [{"id": "runtime", "name": "Workers + Durable Objects", "layer": "Trusted runtime", "purpose": "Main-agent identity, durable state, request routing, scheduling, and coordination.", "status": "Candidate", "caveat": "Do not equate durable availability with a continuously running process.", "source": "https://developers.cloudflare.com/agents/", "notes": ""}, {"id": "harness", "name": "Agents SDK + Pi Durable", "layer": "Agent loop", "purpose": "Evaluate as the main-agent harness. Keep the CLI coding worker a distinct integration.", "status": "Evaluate", "caveat": "Pi Durable is experimental; pin compatible package versions and test recovery.", "source": "https://developers.cloudflare.com/agents/harnesses/pi/", "notes": ""}, {"id": "computer", "name": "Cloudflare Computer", "layer": "Durable workspace", "purpose": "Plans, notes, small working files, task briefs, and filesystem tools for the coordinator.", "status": "Candidate", "caveat": "Core and JavaScript backend are stable in current repository docs; ContainerBackend and sync remain experimental.", "source": "https://github.com/cloudflare/computer/blob/main/packages/computer/README.md", "notes": ""}, {"id": "sandbox", "name": "Container-backed Sandboxes", "layer": "Untrusted execution", "purpose": "Fresh Linux environment per coding or verification job; native checkout and temporary dependencies.", "status": "Candidate", "caveat": "MicroVM boundary; everything inside a sandbox shares its trust zone. Check beta limits and task compatibility.", "source": "https://developers.cloudflare.com/sandbox/", "notes": ""}, {"id": "browser", "name": "Browser Run", "layer": "Browser automation", "purpose": "Task-scoped Chrome, screenshots, user-journey tests, optional live inspection.", "status": "Candidate", "caveat": "Separate environment; route app access deliberately. Fresh sessions and synthetic accounts.", "source": "https://developers.cloudflare.com/agents/tools/browser/", "notes": ""}, {"id": "workflow", "name": "Workflows", "layer": "Deterministic process", "purpose": "Durable execution \u2192 verification \u2192 release sequence with bounded retries and waits.", "status": "Candidate", "caveat": "Use idempotency keys for side effects; model output must not rewrite policy.", "source": "https://developers.cloudflare.com/workflows/", "notes": ""}, {"id": "gateway", "name": "AI Gateway / model APIs", "layer": "Model access", "purpose": "Route provider requests and isolate credentials in trusted services.", "status": "Evaluate", "caveat": "Choose provider data policies, retention, spend limits, and logging settings explicitly.", "source": "https://developers.cloudflare.com/ai-gateway/", "notes": ""}, {"id": "storage", "name": "R2 + metadata database", "layer": "Artifacts & catalog", "purpose": "Patches, screenshots, recordings, documents, and indexable metadata with retention rules.", "status": "Evaluate", "caveat": "R2 is object storage, not by itself an access policy, backup plan, or searchable personal memory.", "source": "https://developers.cloudflare.com/r2/", "notes": ""}, {"id": "retrieval", "name": "AI Search / Vectorize", "layer": "Optional retrieval", "purpose": "Add when a growing wiki or artifact catalog requires semantic search.", "status": "Later", "caveat": "Begin with explicit records and provenance; retrieval is not an authorization boundary.", "source": "https://developers.cloudflare.com/ai-search/", "notes": ""}, {"id": "access", "name": "Access + scoped secrets + outbound handlers", "layer": "Security", "purpose": "Authenticate devices and services; keep credentials outside untrusted jobs.", "status": "Required", "caveat": "Every broker checks user, task, resource, operation, and expiry.", "source": "https://developers.cloudflare.com/sandbox/concepts/security/", "notes": ""}, {"id": "queues", "name": "Queues", "layer": "Optional dispatch", "purpose": "Buffer asynchronous work and control dispatch as scale grows.", "status": "Later", "caveat": "Consumers must tolerate duplicate delivery and enforce concurrency limits.", "source": "https://developers.cloudflare.com/queues/", "notes": ""}, {"id": "interface", "name": "Web / mobile / app integrations", "layer": "User surface", "purpose": "One interaction identity across clients; T3 optional for coding-oriented supervision.", "status": "Open", "caveat": "Client continuity, notifications, offline capture, and app permissions require product design.", "source": "https://developers.cloudflare.com/agents/", "notes": ""}], "decisions": [{"id": "dec-0", "title": "Cloudflare as platform", "status": "Chosen direction", "rationale": "User preference: use Cloudflare as the platform. Specific products and limits still need validation.", "next": "Keep job contracts and data export portable; avoid requiring every component on day one."}, {"id": "dec-1", "title": "One interaction agent", "status": "Chosen direction", "rationale": "One main agent communicates with me and delegates to specialists across devices and future apps.", "next": "Define user identity, channel identities, sessions, and notification behavior."}, {"id": "dec-2", "title": "Pi as agent harness", "status": "Proposed", "rationale": "Pi is the preferred open agent direction from the conversation, but CLI and Pi Durable are separate choices.", "next": "Compare a minimal durable coordinator with a Pi CLI sandbox worker; test version compatibility."}, {"id": "dec-3", "title": "Autonomy through policy", "status": "Chosen direction", "rationale": "Start restrictive, with user-adjustable guardrails and a learned approver to explore. See the voice-session decision for unresolved delegation boundaries.", "next": "Write per-domain action classes: read, draft, modify, share, delete, spend, deploy."}, {"id": "dec-4", "title": "Self-improving system", "status": "Chosen direction", "rationale": "Bootstrap conversation, then coding and dev deployments; PR and artifacts reviewed by the user before production. Discuss substantial features before implementation.", "next": "Define evaluation suite, protected policy store, staged rollout, versioning, and rollback."}, {"id": "dec-5", "title": "Canonical memory and wiki", "status": "Chosen direction", "rationale": "Queryable retrieval plus parallel memory enrichment. Quiet ordinary memory with inspection/tuning. Financial and medical context stays separate with provisional task-scoped access. Research providers later.", "next": "Choose formats, entity IDs, conflict handling, retention, and deletion propagation."}, {"id": "dec-6", "title": "Recordings and media processing", "status": "Open", "rationale": "Device capture, speech processing, and sensitive identity/location enrichment are not yet designed.", "next": "Validate consent flow, provider data handling, on-device options, and storage costs."}, {"id": "dec-7", "title": "Cross-device synchronization", "status": "Chosen direction", "rationale": "Offline-first clients, cloud-authoritative state and eager sync. Initially typed requests queue offline; live voice requires connectivity. Mac \u2192 web \u2192 native Android.", "next": "Design authenticated clients, session merge, offline queue, and channel notification deduplication."}, {"id": "voice-0", "title": "Voice-first surfaces", "status": "Chosen direction", "rationale": "Voice is primary, activated by a button or wake word; exact activation defaults remain open. Chat is secondary. Surface background results as artifacts, websites and interactive interfaces for input and action.", "next": "Resolve implementation details without changing the confirmed preference."}, {"id": "voice-1", "title": "Client rollout", "status": "Chosen direction", "rationale": "Mac alone first, then web, then native Android. Core remains portable across macOS, Windows and Linux; later desktop and iOS timing is open.", "next": "Resolve implementation details without changing the confirmed preference."}, {"id": "voice-2", "title": "Context-aware notifications", "status": "Chosen direction", "rationale": "Choose delivery using priority, need for user action, active device and work/social context exposed by devices. Signal sources, permissions and interruption thresholds remain open; continuous surveillance is not implied.", "next": "Resolve implementation details without changing the confirmed preference."}, {"id": "voice-3", "title": "Adjustable autonomy and learned approval", "status": "Chosen direction", "rationale": "Start restrictive and ask more often early. User can tighten or relax guardrails. Explore an approver model learning from approvals and denials, approving suitable actions within delegated authority and flagging exceptions. Rule promotion and fixed boundaries remain open.", "next": "Resolve implementation details without changing the confirmed preference."}, {"id": "voice-4", "title": "Queryable and parallel memory", "status": "Chosen direction", "rationale": "Provide agent-queryable retrieval and a parallel model maintaining memory and enriching conversations. Store/use ordinary memory quietly, with inspection and controls over retention. Research Supermemory and alternatives later; no provider selected.", "next": "Resolve implementation details without changing the confirmed preference."}, {"id": "voice-5", "title": "Sensitive memory exception", "status": "Chosen direction", "rationale": "Keep financial and medical information separate from ordinary memory. Explicit user tagging or requests grant provisional access for a specific task. General retention and unrelated reuse are not authorized. Storage, expiry, revocation and derived-data cleanup remain open.", "next": "Resolve implementation details without changing the confirmed preference."}, {"id": "voice-6", "title": "Self-extension bootstrap", "status": "Chosen direction", "rationale": "Begin with conversation, add coding for April itself and development deployments, then grow capabilities incrementally. Initial flow: tested feature and dev preview, PR with artifacts, user review/approval, then merge and production. No deployment is being performed now.", "next": "Resolve implementation details without changing the confirmed preference."}, {"id": "voice-7", "title": "User-led feature readiness", "status": "Chosen direction", "rationale": "Discuss substantial features before implementation; April may arrange a discussion or user may initiate one. User decides when the plan is ready. Conversational PR reviews are desired over time; scheduling and approval-recording mechanics remain open.", "next": "Resolve implementation details without changing the confirmed preference."}, {"id": "voice-8", "title": "Offline-first and eager sync", "status": "Chosen direction", "rationale": "Cloud is the source of truth. Persist locally and sync eagerly when online. Initially offline typed chat queues requests; live voice is unavailable. Local inference is not required; reconnect dispatch, conflicts and offline artifact availability remain open.", "next": "Resolve implementation details without changing the confirmed preference."}, {"id": "portable-core", "title": "Platform-agnostic core; Mac adapters first", "status": "Chosen direction", "rationale": "Shared core targets macOS, Windows and Linux; native capability adapters start on macOS. GUI and language remain open.", "next": "Define capability boundary and fake adapter."}, {"id": "mac-0", "title": "Unified April application", "status": "Chosen direction", "rationale": "Keep voice, vault browser, previews and interactive artifacts in one April application. Obsidian is a UX reference; a required separate Obsidian host is ruled out. Reuse libraries; GUI framework and core language remain open.", "next": "Validate the integrated Mac experience; details explicitly marked open remain unresolved."}, {"id": "mac-1", "title": "Mac voice activation and focus", "status": "Chosen direction", "rationale": "Hold a configurable key to activate an ongoing voice session; release does not end it. Dismiss by spoken request or double-press. Preserve keyboard focus in the current app. Timing and failure behavior remain open.", "next": "Validate the integrated Mac experience; details explicitly marked open remain unresolved."}, {"id": "mac-2", "title": "Notch and multi-monitor presence", "status": "Chosen direction", "rationale": "Listening and speaking have distinct wave/blob states. On notched displays emerge from the notch. On non-notched displays stay invisible until activated, then show a top-center indicator below the menu bar. Appear on the screen the user is actively working on, including external monitors.", "next": "Validate the integrated Mac experience; details explicitly marked open remain unresolved."}, {"id": "mac-3", "title": "User-owned multi-vault artifacts", "status": "Chosen direction", "rationale": "Vaults are user-chosen storage folders with a default and additional vaults. Conversations do not belong to a vault; public-to-April vaults are available across conversations. Private access remains explicit and task scoped. Browsing a vault is not a session switch.", "next": "Validate the integrated Mac experience; details explicitly marked open remain unresolved."}, {"id": "mac-4", "title": "Private vault grants", "status": "Chosen direction", "rationale": "Private-vault information requires explicit, specific, temporary access that expires. Financial/medical information remains excluded from ordinary memory. Grant duration, operations, revocation and derived-context cleanup remain open.", "next": "Validate the integrated Mac experience; details explicitly marked open remain unresolved."}, {"id": "mac-5", "title": "Non-blocking artifact browsing", "status": "Chosen direction", "rationale": "Indicate new and edited artifacts in the vault browser. User can inspect now or later; unread items do not block subsequent work. Actual required user input or approval may block dependent work.", "next": "Validate the integrated Mac experience; details explicitly marked open remain unresolved."}, {"id": "mac-6", "title": "Artifact types and preview scope", "status": "Chosen direction", "rationale": "Support Markdown, DOCX previews, JavaScript source and interactive artifacts within April. Full Word editing is not initially required. Interactive execution needs an isolated surface; library and rendering choices remain open.", "next": "Validate the integrated Mac experience; details explicitly marked open remain unresolved."}, {"id": "mac-7", "title": "Replaceable realtime voice provider", "status": "Chosen direction", "rationale": "Start with OpenAI realtime voice, with natural spoken interruption and a replaceable provider layer preserving required behaviors. Review official capabilities before design; cross-provider feature equivalence is unproven. Wake-word investigation is deferred.", "next": "Validate the integrated Mac experience; details explicitly marked open remain unresolved."}, {"title": "Initial coding scope and GitHub review", "status": "Chosen direction", "rationale": "Start with April's own repositories only; the user adds other projects later. Host repositories on GitHub and use GitHub PRs and reviews as the review record, including when discussions happen through April. No repository creation, push or credential setup is requested by this design discussion.", "id": "coding-scope-github", "next": "Define isolated execution environment and scoped repository access."}, {"title": "Cloudflare specialist execution", "rationale": "Confirmed: agent coordination and coding builds/tests run on Cloudflare, following the existing specialist architecture. Mac supplies native interaction and device integrations. A platform-specific macOS build/signing/testing plan remains an engineering question, not a preference to reopen.", "status": "Chosen direction", "id": "cloudflare-specialist-execution", "next": "Validate coding sandbox workflow and native Mac release/testing path."}, {"title": "Cloud-hosted vault sync and access separation", "rationale": "Both public-to-April and private vaults live on Cloudflare and sync eagerly with local artifacts whenever connected. Cloudflare is authoritative; encryption and secure defaults are required. Sync does not grant agent use of private data. Key custody, encryption scheme, recovery and sync details remain open.", "status": "Chosen direction", "id": "approval-vault-0", "next": "Define grant lifetime, encryption keys, explicit consent and enforcement contract."}, {"title": "Centralized explicit approval flow", "rationale": "Every approval request routes through a central approval agent/service. It shows an overlay with the scope and records a user button click in an audit log. Private-vault approval cannot be inferred from speech; April cannot bypass the approval service. Mandatory private consent remains distinct from learned approvals within policy. Grant lifetime, revocation and enforcement implementation remain open.", "status": "Chosen direction", "id": "approval-vault-1", "next": "Define grant lifetime, encryption keys, explicit consent and enforcement contract."}, {"title": "Audience and distribution", "status": "Chosen direction", "rationale": "Personal use first; later, anyone with a Cloudflare account and a MacBook should be able to use April. Initial multi-user service is not required.", "id": "audience-distribution", "next": "Define later install/provisioning workflow."}, {"title": "Plugin architecture across integrations, specialists and artifacts", "rationale": "Confirmed major direction: plugin architecture for app/tool integrations (initially Cursor, Slack and browser), specialist subagents and vault artifact support (Markdown, PDFs, Word, interactive HTML and JavaScript). Detailed contracts, packaging, isolation, authority and lifecycle will be discussed later; no implementation chosen.", "status": "Chosen direction", "id": "plugin-architecture", "next": "Return to detailed plugin architecture in a later discussion."}, {"title": "Staged desktop awareness and computer use", "status": "Chosen direction", "rationale": "Initially see only content explicitly shared by the user. Later add broader desktop-app awareness and delegated interaction under the central permission model. Codex computer-use experience is the north star; deep dive deferred to a separate session. No initial ambient desktop monitoring or control.", "id": "staged-desktop-awareness", "next": "Separate computer-use deep dive."}, {"title": "English/Hindi voice and system audio", "status": "Chosen direction", "rationale": "Initially English and Hindi, including primarily English conversations with occasional Hindi. Support microphone and system audio; music identification is an example task. Capture activation, permissions, retention and implementation remain open; continuous capture is not selected.", "id": "initial-audio-requirements", "next": "Define capture/session controls and evaluate bilingual voice behavior."}, {"title": "Background capture with visible listening indicator", "status": "Chosen direction", "rationale": "Explicitly started listening/recording sessions continue when the workspace window closes, including meetings. Show a listening/capture indicator near the notch or equivalent whenever audio is captured. Inactive can stay invisible; active capture cannot. Closing workspace differs from dismissing the session. Retention, sleep behavior and start/stop details remain open; no automatic meeting recording is selected.", "id": "background-audio-indicator", "next": "Define retention and session lifecycle."}, {"title": "Reference transcription and opt-in audio retention", "status": "Chosen direction", "rationale": "Reference transcription may lag. Do not retain audio by default after processing; user may explicitly request a saved recording for meetings/conversations as a backup. This supersedes earlier blanket no-audio remarks. Live voice responsiveness remains separate. Provider retention, temporary buffers and saved-recording expiry/deletion remain open.", "id": "final-audio-retention", "next": "Define provider/temporary-buffer handling and expiry for opted-in recordings."}, {"title": "Private access expires with the task", "status": "Chosen direction", "rationale": "User confirms that private-vault access granted for a task stops when the task ends. It is not a continuing permission for later tasks. Terminal-state handling, early revocation and cached/derived-context cleanup remain implementation work.", "id": "task-bound-private-expiry", "next": "Specify terminal-state enforcement and context cleanup."}, {"title": "Initial operating budget", "status": "Chosen direction", "rationale": "Start with Cloudflare $5 base-plan expectation plus approximately $20/month AI; flexible AI budget based on use. Infrastructure fit is not verified. Overage behavior, warnings and caps remain open.", "id": "budget-correction-0", "next": "Define practical budgets and correction mechanisms during implementation."}, {"title": "Evolving approval and conversational correction", "status": "Chosen direction", "rationale": "Discover additional approval categories during use; existing mandatory consent remains. User asks April to correct noticed mistakes. Recoverable history is a recommendation, not yet selected; irreversible side effects need separate treatment.", "id": "budget-correction-1", "next": "Define practical budgets and correction mechanisms during implementation."}, {"title": "Efficient, fluid client over shipping speed", "status": "Chosen direction", "rationale": "Prioritize efficient resource use and fluid/non-janky interactions over shipping sooner. Evaluate idle CPU/memory/battery and under-load responsiveness. Numeric targets, minimum hardware and framework remain open.", "id": "performance-soft-budget-0", "next": "Specify measurable workload and operating limits."}, {"title": "Soft AI budget nudge", "status": "Chosen direction", "rationale": "$20 monthly AI threshold is non-blocking. Ask/nudge about increased spend, but keep working while pending. Exact overrun bounds and accounting remain open; this is not unlimited spend authority.", "id": "performance-soft-budget-1", "next": "Specify measurable workload and operating limits."}, {"title": "Clarify and correct wiki conflicts", "status": "Chosen direction", "rationale": "For conflicting wiki information, ask the user for clarification before selecting a version. Correct the wiki, then continue affected work from the corrected record. Do not silently choose or leave disagreement unresolved as the final behavior. Provenance/history and stale-derived-context cleanup remain supporting implementation work.", "id": "wiki-conflict-clarification", "next": "Define clarification presentation and corrected-context propagation."}, {"title": "Proactive simple work; discuss heavy work first", "status": "Chosen direction", "rationale": "Proactively research and perform simpler day-to-day work within existing guardrails. Research and notes can feed coding ideas. Substantial work, such as building a feature, needs a user conversation first. Detailed triggers, topic selection and routing are deferred; this is sufficient direction for this pass.", "id": "proactivity-boundary", "next": "Map triggers and specialist handoffs during later design."}, {"title": "Add missing capability, then resume task", "status": "Chosen direction", "rationale": "When a user task needs an unsupported feature, inform the user, add the capability where feasible, then resume and complete the original task. Keep the user in the loop. Existing substantial-feature discussion, scoped permissions, dev/PR review and production approval still apply; no bypass or guaranteed feasibility is implied.", "id": "capability-gap-resume", "next": "Link task and feature dependency; retain planning and release policy."}, {"title": "Mac performance baseline", "status": "Chosen direction", "rationale": "Initial performance baseline: the user's current MacBook Pro, Apple M2 Pro, 10-core CPU (6 performance + 4 efficiency), 16 GB unified memory, currently macOS 26.7.1. Hardware read locally at the user's request; serial numbers and device identifiers are not recorded. Run efficiently and fluidly on this machine. This is an initial target, not a benchmark-proven minimum; older OS/hardware support remains open.", "id": "hardware-remote-0", "next": "Validate performance and scoped remote capability routing."}, {"title": "Phone requests can use authorized Mac", "status": "Chosen direction", "rationale": "Confirmed: requests from the phone may use capabilities on an online, authorized Mac. Scoped permissions remain required; routing and unavailable-device handling remain implementation work.", "id": "hardware-remote-1", "next": "Validate performance and scoped remote capability routing."}, {"title": "Preserve both sides of sync conflicts", "status": "Chosen direction", "rationale": "Preserve both versions of conflicting local/cloud edits and ask the user which to keep. Do not silently overwrite either version. Cloud remains authoritative after reconciliation; version tracking and resolution propagation need implementation.", "id": "sync-conflict-preservation", "next": "Define version detection and user resolution workflow."}, {"title": "Reviewed approval learning loop", "status": "Chosen direction", "rationale": "Dedicated approval agent evaluates requests, auto-approves within user policy and learns from decisions. April initiates requests through that system. Review repeated routinely approved prompts and promote them to explicit default allowances in operating context/policy. Existing explicit consent boundaries remain until changed by user.", "id": "approval-language-0", "next": "Implement reviewed policy updates; evaluate technical stack separately."}, {"title": "Choose language by requirements", "status": "Chosen direction", "rationale": "No programming-language preference or exclusion. Select implementation based on portability, resource efficiency, fluid interaction and other established requirements; stack choice is an engineering evaluation.", "id": "approval-language-1", "next": "Implement reviewed policy updates; evaluate technical stack separately."}, {"title": "Replace chat/voice/computer-use and Cursor prompting workflows", "status": "Chosen direction", "rationale": "Replace the user's ChatGPT app workflows: text chat, voice conversation and computer use. Later take over much of manual Cursor prompting. Cursor remains an initial integration target; reducing prompting does not necessarily mean replacing the editor. Full parity is a destination, not a v1 promise.", "id": "replacement-workflows", "next": "Use these workflows as architecture and acceptance-test reference points."}, {"title": "Orchestrate existing tools rather than rebuild them", "rationale": "User confirms retaining Cursor as editor, Slack as client and existing browser initially. April orchestrates them, taking over much manual prompting, while providing its own unified voice/chat/artifact surface. This does not select API versus UI adapters.", "status": "Chosen direction", "id": "existing-tool-orchestration", "next": "Evaluate integration adapters later; do not rebuild these tools initially."}, {"title": "Cloud-first tasks continue when the Mac disconnects", "status": "Chosen direction", "rationale": "All tasks are cloud-first and most work runs in Cloudflare. All files, including public and private vault contents, have cloud storage as their persistent home and source of truth at all times. The Mac is a lightweight client for voice, visuals and local device integrations; local copies and offline pending changes synchronize with cloud state. Approved cloud tasks, including private-file tasks, continue if the Mac disconnects, within the existing task-scoped grant. Disconnection neither revokes the grant nor expands its scope; private access still expires when the task ends. Operations needing a local integration require that device to be reachable. Encryption-key custody, revocation and enforcement remain implementation work.", "id": "cloud-first-disconnect-continuity", "next": "Specify cloud grant enforcement, keys and unavailable local integrations."}, {"title": "Conversations are independent of vaults", "status": "Chosen direction", "rationale": "Conversations are not tied to a particular vault. Vaults organize stored data and access, not conversational sessions. Public-to-April vaults are available to April across conversations without an active-vault switch granting access. Browsing a vault in the UI does not create a new conversation or restrict the conversation to that vault. Private vaults retain explicit task-scoped approval and task-end expiry. This supersedes earlier suggestions that the active vault defines the conversation context; an individual tool operation may still target a specific vault.", "id": "vault-independent-conversations", "next": "Define conversation/session lifecycle separately from storage access."}, {"title": "Personal, medical and financial vaults; work deferred", "status": "Chosen direction", "rationale": "Initial scope excludes work and any work vault. Start with personal, medical and financial vaults. Work can be reconsidered later. Vaults remain storage/access boundaries, not conversation containers; public-to-April vaults are always available, private data requires task-scoped approval.", "id": "personal-only-vault-scope", "next": "Define conversation organization independently of vaults."}, {"title": "One ongoing thread; April manages internal context", "status": "Chosen direction", "rationale": "The user interacts through a single ongoing thread and does not manage separate conversation sessions. April may internally organize, branch and manage task/topic context as needed. Internal context/session boundaries are implementation details, not user-facing vault boundaries. Vaults remain independent storage/access domains. This does not require one ever-growing model prompt or bypass private-data approvals.", "id": "single-thread-internal-context", "next": "Specify internal branch routing, interruption and task lifecycle."}, {"title": "Conversation interruption leaves delegated tasks running", "status": "Chosen direction", "rationale": "Spoken interruption stops or redirects the conversation, not delegated tasks. Heavy use of specialist/subagent execution is intended; tasks continue independently of the live conversation and require an explicit user instruction to interrupt/cancel them. Task lifecycle must be separate from voice playback/session lifecycle. Existing failure, permission and safety limits still apply; they are not overridden by conversational independence.", "id": "voice-task-isolation-0", "next": "Define explicit task cancellation and internal branch coordination."}, {"title": "Study internal threading and long-context UX", "status": "Chosen direction", "rationale": "Study Codex's long-conversation and threading experience as a reference for internal context organization. User sees one ongoing thread; heavy subagent use is intended. Specific mechanisms are to be researched, not assumed.", "id": "voice-task-isolation-1", "next": "Define explicit task cancellation and internal branch coordination."}, {"title": "Specialists may delegate further", "status": "Chosen direction", "rationale": "Specialist agents may delegate further to subagents within the original task authority; delegation is not restricted to the main interaction agent. Represent parent/child task relationships and return results through the hierarchy while April remains the single user-facing coordinator. Delegation does not expand private-data access or permissions. Depth/concurrency limits, budget allocation, conflict handling and cancellation propagation remain implementation decisions.", "id": "nested-specialist-delegation", "next": "Specify child-task authority, result and cancellation contracts."}, {"title": "Summary overview and full subagent audit tree", "status": "Chosen direction", "rationale": "Use top-level task summaries for the overview, with the full specialist/subagent parent-child tree available for monitoring and audit. Preserve nested execution lineage, status and evidence; exact UI and audit fields remain design work and private data boundaries still apply.", "id": "full-task-audit-tree", "next": "Design summary view and expandable monitoring/audit tree."}, {"title": "Pause and resume delegated tasks", "status": "Chosen direction", "rationale": "Provide explicit task pause/resume in addition to cancellation. Voice interruption does not pause tasks. Proposed access is conversational commands and task-summary/tree controls; final placement is not selected. Define safe checkpoints, in-flight actions, child propagation, retained progress and permission revalidation; pausing is not undo.", "id": "pause-resume-task-control", "next": "Specify pause checkpoints and subagent propagation; choose control placement."}, {"title": "Coordinator scopes a pause from the user\u2019s reason", "status": "Chosen direction", "rationale": "User supplies a reason for pausing. The coordinator decides which subagents should pause or continue based on that reason, rather than applying a fixed stop-all-children rule. Record the reason and decision for audit. Respect the expressed pause intent; clarify material ambiguity. Safe checkpoints/in-flight handling remain implementation work.", "id": "reasoned-pause-propagation", "next": "Define auditable coordinator pause decisions and safe checkpoints."}, {"title": "Bring stuck specialist work to the user", "status": "Chosen direction", "rationale": "When a specialist is genuinely stuck, bring the blocker to the user and work through it together. The user sees this as a possible sign that requirements need clarification or the specialist scope is too large. Do not silently substitute specialists, expand scope or run an autonomous repair loop as the default response to being stuck. Preserve task state and resume or rescope after clarification. The definition/detection of a blocker and handling of routine transient errors remain implementation details. Pause reason taxonomy is deferred; user provides a reason when needed.", "id": "stuck-specialist-human-escalation", "next": "Define blocker evidence, clarification and rescoping transitions."}, {"title": "Auto-send offline requests on reconnect", "status": "Chosen direction", "rationale": "Automatically send requests queued while offline when the client reconnects; no separate queue-review step is required. Sending a queued request is not approval to bypass private access, release or other policy checks. Ordering, deduplication, cancellation of unsent requests and stale-scope handling remain implementation details.", "id": "auto-send-reconnect-queue", "next": "Specify ordered, deduplicated delivery under existing approval policy."}, {"title": "Best-effort automatic voice resumption", "status": "Chosen direction", "rationale": "If connectivity drops during an active voice session, attempt automatic resumption on a best-effort basis. If recovery is not possible, the user can summon April again. Do not revive a session explicitly dismissed during the outage. Preserve visible connection/listening state; do not imply offline voice inference or default audio retention. Recovery deadlines, buffering and failure indicators remain implementation details.", "id": "best-effort-voice-recovery", "next": "Define recovery/failure indicators and explicit-dismissal precedence."}, {"title": "Five-second automatic voice recovery window", "status": "Chosen direction", "rationale": "Bound automatic voice-session recovery to approximately five seconds. If it cannot resume within that attempt window, stop automatic resumption and wait for the user to summon/resume manually. Display recovery/failure state and do not reopen a dismissed session. Exact timer implementation remains engineering work.", "id": "five-second-voice-recovery", "next": "Implement bounded recovery and manual-resume state."}, {"title": "Full local copy first; cloud-only on-demand later", "status": "Chosen direction", "rationale": "Initially keep/copy all vault files locally and synchronize everything to the cloud, simplifying the first version. Cloud remains authoritative and private-file agent access stays task scoped. Future direction: fetch only files being viewed or needed, keeping the rest cloud-only. Selective caching/pinning is not required initially. This describes future product behavior, not authorization to copy/upload the user's current files now.", "id": "phased-vault-materialization", "next": "Specify full-mirror sync first; design on-demand fetching later."}, {"title": "Restorable bin; user reviews every seven days", "status": "Chosen direction", "rationale": "Deleting a vault file removes it from active use and synchronizes deletion while retaining a restorable bin entry. The user's final preference supersedes the earlier automatic seven-day purge idea: prompt the user to review pending deletions every seven days, and let the user clear them at review. Do not permanently purge solely because seven days elapsed. Preserve recoverability until the user explicitly clears the bin. This is a future April product workflow, not a request to create a real reminder/automation now. Bin permissions, private metadata, restores and replica/backup cleanup remain implementation details.", "id": "reviewed-deletion-bin", "next": "Define synchronized tombstones, restore, explicit purge and periodic review."}], "roadmap": [{"id": "voice-bootstrap", "phase": "Bootstrap priority", "title": "Mac conversation \u2192 coding \u2192 development preview and PR", "status": "Planned", "notes": "Voice-first; discuss big features before implementation, user decides readiness; review and approval before production. Then web and native Android."}, {"id": "task-0", "phase": "Foundation", "title": "Write the identity and permission model", "status": "Planned", "notes": "Who can request what, for which data, on which device?"}, {"id": "task-1", "phase": "Foundation", "title": "Define the shared job and result contract", "status": "Planned", "notes": "IDs, acceptance criteria, scope, budget, state transitions, evidence, cancellation."}, {"id": "task-2", "phase": "Foundation", "title": "Select the canonical state and export formats", "status": "Planned", "notes": "Keep ownership portable and separate originals from derived records."}, {"id": "task-3", "phase": "First vertical slice", "title": "Build main-agent chat \u2192 one coding job \u2192 result", "status": "Planned", "notes": "One authenticated web client, one low-risk repository, fresh sandbox, patch output."}, {"id": "task-4", "phase": "First vertical slice", "title": "Test crash recovery, cancellation, and cost ceilings", "status": "Planned", "notes": "Deliberately disconnect clients, restart workers, and fail provider requests."}, {"id": "task-5", "phase": "First vertical slice", "title": "Add independent checks and a preview", "status": "Planned", "notes": "Verify the exact candidate in a fresh environment; show evidence."}, {"id": "task-6", "phase": "Knowledge", "title": "Build the first wiki learning path", "status": "Planned", "notes": "One topic, three depths, citations, freshness, corrections."}, {"id": "task-7", "phase": "Capture & artifacts", "title": "Pilot an authorized recording upload", "status": "Planned", "notes": "Timestamped transcript, notes, corrections, and retention."}, {"id": "task-8", "phase": "Capture & artifacts", "title": "Index a chosen small media collection read-only", "status": "Planned", "notes": "Original preservation, metadata provenance, reversible labels."}, {"id": "task-9", "phase": "Controlled autonomy", "title": "Define and test automatic release policies", "status": "Planned", "notes": "Low-risk project first; exact-artifact checks, health monitoring, rollback."}, {"id": "task-10", "phase": "Controlled autonomy", "title": "Enable staged platform self-improvement", "status": "Planned", "notes": "Separate candidate, evaluator, and release authority."}, {"id": "task-11", "phase": "Expansion", "title": "Add second-device access and notification preferences", "status": "Planned", "notes": "Resume context safely and avoid duplicate interruptions."}, {"id": "memory-research", "phase": "Knowledge", "title": "Deep dive Supermemory and alternatives", "status": "Planned", "notes": "Queryable retrieval, parallel memory enrichment, inspectable quiet memory, financial/medical exclusions and scoped access. Research deferred."}, {"id": "mac-task-0", "phase": "Mac experience", "title": "Unified April application", "status": "Planned", "notes": "Keep voice, vault browser, previews and interactive artifacts in one April application. Obsidian is a UX reference; a required separate Obsidian host is ruled out. Reuse libraries; GUI framework and core language remain open."}, {"id": "mac-task-1", "phase": "Mac experience", "title": "Mac voice activation and focus", "status": "Planned", "notes": "Hold a configurable key to activate an ongoing voice session; release does not end it. Dismiss by spoken request or double-press. Preserve keyboard focus in the current app. Timing and failure behavior remain open."}, {"id": "mac-task-3", "phase": "Mac experience", "title": "User-owned multi-vault artifacts", "status": "Planned", "notes": "User chooses artifact folder locations. Provide a default vault and additional vaults, with an Obsidian-style file/folder browser and tabbed artifacts. Cross-context accessible vaults may be consulted from other active vaults; this is not internet publication."}, {"id": "mac-task-4", "phase": "Mac experience", "title": "Private vault grants", "status": "Planned", "notes": "Private-vault information requires explicit, specific, temporary access that expires. Financial/medical information remains excluded from ordinary memory. Grant duration, operations, revocation and derived-context cleanup remain open."}, {"id": "mac-task-6", "phase": "Mac experience", "title": "Artifact types and preview scope", "status": "Planned", "notes": "Support Markdown, DOCX previews, JavaScript source and interactive artifacts within April. Full Word editing is not initially required. Interactive execution needs an isolated surface; library and rendering choices remain open."}, {"id": "mac-task-7", "phase": "Mac experience", "title": "Replaceable realtime voice provider", "status": "Planned", "notes": "Start with OpenAI realtime voice, with natural spoken interruption and a replaceable provider layer preserving required behaviors. Review official capabilities before design; cross-provider feature equivalence is unproven. Wake-word investigation is deferred."}], "ideas": [{"id": "idea-1", "title": "Future specialist ideas", "body": "Travel planning, health information organization, learning coach, household administration, finance summaries, and creative projects. Each needs its own data scope and action policy.", "status": "Inbox"}], "contracts": {"job": "jobId / parentJobId / userId / specialist / repository or resource IDs\nobjective / acceptanceCriteria / inputArtifacts / baseRevision\nallowedOperations / networkPolicy / credentialScopes\nmodelBudget / wallClockLimit / retryLimit / cancellation\npolicyVersion / requestedBy / authorizationReference", "result": "jobId / status / outputArtifacts / exactRevision\nsummary / evidence / checks / uncertainty\nsideEffects / resourceUsage / followUpQuestions\nprovenance / retention / nextRecommendedAction", "lifecycle": "Requested \u2192 Authorized \u2192 Queued \u2192 Running \u2192 Verifying \u2192 Completed\nAlternative outcomes: Needs attention / Failed / Cancelled / Expired\nA completed worker turn is not necessarily a verified task outcome.\nCheckpoint before retries; make external side effects idempotent."}, "notes": "This is a living design workspace, not a deployed agent system. Seeded from the conversation on 30 October 2026. Agent responsibilities and architecture choices are proposals unless marked as a chosen direction.\n\nNext design conversation: pick one vertical slice and define its job contract, permission boundary, persistence, and success checks.\nVoice clarifications on 31 October 2026 are recorded in the decision register. Next conversation: Mac experience and concrete bootstrap scope. No implementation or deployment has been performed.\nMac decisions updated: separate Obsidian host ruled out. See Mac decision entries. Earlier conflicting proposals are superseded. Next: GUI and library evaluation for unified voice and artifact experience.\nSession paused by user. Resume unresolved questions one at a time; see Original Q&A review and wiki resumption log. No audio retention by default; explicit opt-in to save recordings. Transcript may lag.\nPaused after broad requirements. Next: technical architecture/GUI evaluation. Approved cloud/private tasks continue when the Mac disconnects within task-scoped access. See Next technical session branch.", "sources": [{"title": "Cloudflare Agents", "url": "https://developers.cloudflare.com/agents/"}, {"title": "Pi Durable harness", "url": "https://developers.cloudflare.com/agents/harnesses/pi/"}, {"title": "Pi in a Linux sandbox", "url": "https://developers.cloudflare.com/sandbox/coding-agents/pi/"}, {"title": "Sandbox security", "url": "https://developers.cloudflare.com/sandbox/concepts/security/"}, {"title": "Cloudflare Computer component status", "url": "https://github.com/cloudflare/computer/blob/main/packages/computer/README.md"}, {"title": "Agent browser tools", "url": "https://developers.cloudflare.com/agents/tools/browser/"}], "voiceRevision": 1, "macRevision": 1, "codingScopeRevision": 1, "cloudExecutionRevision": 1, "approvalVaultRevision": 1, "clarificationReview": {"reviewed": "2026-10-31", "basis": "Original 50-question discussion reconciled with subsequent voice answers and project wiki. Partial means direction established but an explicit detail remains unresolved. No new answers inferred from proposed architecture alone.", "questions": [{"number": 1, "topic": "Daily experience", "status": "Answered", "detail": "Voice-first agent throughout the day; background work surfaces artifacts and interactive interfaces."}, {"number": 2, "topic": "Top three tasks", "status": "Partial", "detail": "Coding/self-extension is first. Other first-priority tasks beyond the bootstrap are not ranked."}, {"number": 3, "topic": "Products to replace", "status": "Answered", "detail": "Replace the user's ChatGPT app workflows for text, voice and computer use. Over time, April should handle much of the manual prompting currently done in Cursor, which remains an integration target."}, {"number": 4, "topic": "Primary product form", "status": "Answered", "detail": "Voice-first unified application; chat is secondary; artifact workspace alongside voice."}, {"number": 5, "topic": "Proactivity", "status": "Answered", "detail": "Background responsibilities and context-aware surfacing, based on priority and need for action."}, {"number": 6, "topic": "Audience", "status": "Answered", "detail": "Personal use first. Later, anyone with a Cloudflare account and a MacBook should be able to use April. Distribution/provisioning details remain engineering work."}, {"number": 7, "topic": "Cross-platform scope", "status": "Answered", "detail": "Platform-agnostic core; native adapters start on Mac. Web then native Android; Windows/Linux later."}, {"number": 8, "topic": "Platform-specific shells", "status": "Partial", "detail": "Unified April experience confirmed; allowable UI differences between operating systems remain open."}, {"number": 9, "topic": "Windows/Linux timing", "status": "Partial", "detail": "Core portability is required; client timing and supported Linux environments remain unspecified."}, {"number": 10, "topic": "Offline requirement", "status": "Answered", "detail": "Offline typed chat queues requests; no initial offline voice or local intelligence. Eager sync to authoritative Cloudflare."}, {"number": 11, "topic": "Headless core", "status": "Answered", "detail": "No headless CLI/API product interface initially; deferred. Internal service APIs are not excluded."}, {"number": 12, "topic": "Third-party extensibility", "status": "Answered", "detail": "Plugin architecture is a major direction across integrations, specialists and artifacts. Detailed third-party contracts/trust/distribution are explicitly deferred."}, {"number": 13, "topic": "First accessibility tasks", "status": "Partial", "detail": "Deep native integration required; exact first read/control workflows are unspecified."}, {"number": 14, "topic": "First target applications", "status": "Partial", "detail": "Coding targets April repos on GitHub; native apps to inspect/control are not named."}, {"number": 15, "topic": "Desktop observation scope", "status": "Answered", "detail": "Only explicitly shared desktop content initially. Broader app awareness/control later; Codex as north star; deep dive deferred."}, {"number": 16, "topic": "API versus visible UI", "status": "Answered", "detail": "API versus UI choice is explicitly deferred per integration; plugin contracts should allow either. No universal preference required now."}, {"number": 17, "topic": "Screenshot/input fallback", "status": "Answered", "detail": "Computer-use details, including screenshot/input fallback, are explicitly deferred to a Codex-inspired deep dive. Initial observation only sees explicitly shared content."}, {"number": 18, "topic": "Concurrent desktop control", "status": "Partial", "detail": "Summoning voice preserves focus; whether automation may take foreground control while user works is open."}, {"number": 19, "topic": "Uncertain targets", "status": "Partial", "detail": "Approval is centralized; behavior for ambiguous UI targets still needs definition."}, {"number": 20, "topic": "Remembering application context", "status": "Partial", "detail": "Quiet inspectable memory chosen; what app content can be captured and retained is not defined."}, {"number": 21, "topic": "Role of voice", "status": "Answered", "detail": "Primary interaction modality."}, {"number": 22, "topic": "Voice activation", "status": "Answered", "detail": "Configurable held key starts persistent session; dismiss by speech or double-press. Wake word later."}, {"number": 23, "topic": "Spoken interruption", "status": "Answered", "detail": "Natural barge-in required; initial OpenAI realtime direction, provider-portable behavior."}, {"number": 24, "topic": "Audio capture scope", "status": "Answered", "detail": "Microphone plus system audio; meetings and music identification are example tasks. Session controls/retention remain separate."}, {"number": 25, "topic": "Capture with UI closed", "status": "Answered", "detail": "Explicitly started sessions continue with workspace window closed, with a visible listening/capture indicator. Sleep/termination behavior remains open."}, {"number": 26, "topic": "Languages and accents", "status": "Answered", "detail": "English and Hindi, including primarily English with occasional mixed Hindi."}, {"number": 27, "topic": "Offline voice", "status": "Answered", "detail": "Not initially available."}, {"number": 28, "topic": "Voice quality priorities", "status": "Partial", "detail": "Reference transcription may lag. Live spoken response/interruption quality, acceptable delays and resource/cost tradeoffs still need targets."}, {"number": 29, "topic": "Wiki content priorities", "status": "Partial", "detail": "Research/learning wiki and personal artifacts are envisioned; initial content mix is not prioritized."}, {"number": 30, "topic": "Autonomous wiki updates", "status": "Partial", "detail": "Background autonomy desired; rules for maintaining versus proposing wiki edits are not specified."}, {"number": 31, "topic": "Document editing depth", "status": "Answered", "detail": "Obsidian-inspired unified workspace; DOCX preview is sufficient initially, not full Word editing."}, {"number": 32, "topic": "Essential content types", "status": "Answered", "detail": "Markdown, DOCX preview, JavaScript source and interactive artifacts requested; other types can be phased."}, {"number": 33, "topic": "Generated interactive interfaces", "status": "Answered", "detail": "Yes, inside unified April; no required separate Obsidian app."}, {"number": 34, "topic":
