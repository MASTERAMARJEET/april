"Knowledge corrections and conflicts", "status": "Answered", "detail": "Actively ask the user to clarify conflicts before choosing; correct the wiki and continue affected work from the corrected version. Provenance and revision mechanics remain design work."}, {"number": 35, "topic": "Knowledge storage", "status": "Answered", "detail": "All persistent files and both public/private vaults live in cloud storage as source of truth. Local folders/copies synchronize eagerly; offline pending edits reconcile later. Storage does not grant private agent access."}, {"number": 36, "topic": "Automatic action scope", "status": "Partial", "detail": "Broad autonomy for simpler proactive work, including research; substantial feature work needs discussion. Additional action classes can be discovered during use; detailed rules deferred."}, {"number": 37, "topic": "Mandatory human involvement", "status": "Partial", "detail": "Private-vault approval uses explicit overlay click and initial production follows PR approval. Additional mandatory approval categories are intentionally discovered during use."}, {"number": 38, "topic": "Permission model granularity", "status": "Partial", "detail": "Central approval model learns decisions and auto-approves within policy; repeated unnecessary prompts can be reviewed into default allowances. Private grants end with task. Enforcement/revocation details remain."}, {"number": 39, "topic": "Activity visibility", "status": "Partial", "detail": "Non-blocking new/edited artifact indicators and context-aware delivery are chosen. Detailed activity/live execution presentation can be designed later."}, {"number": 40, "topic": "Automatic memory", "status": "Answered", "detail": "Quiet storage/use with inspection and tuning; query engine plus parallel memory model; research deferred."}, {"number": 41, "topic": "Excluded information", "status": "Partial", "detail": "Financial/medical excluded from ordinary memory with provisional task access; any other exclusions not specified."}, {"number": 42, "topic": "Mistake recovery", "status": "Answered", "detail": "User asks April conversationally to fix noticed mistakes. Recovery mechanisms such as history/undo are implementation design rather than an unanswered interaction preference."}, {"number": 43, "topic": "Cross-device continuity", "status": "Answered", "detail": "One continuous user-facing thread across interactions; April internally branches and organizes context as needed. Conversations do not belong to vaults. Cross-device protocol and context-routing mechanics remain implementation work."}, {"number": 44, "topic": "Remote device capabilities", "status": "Answered", "detail": "Yes: requests from the phone may use an online, authorized Mac. Remote routing, device choice and unavailable-device behavior remain implementation work."}, {"number": 45, "topic": "Mac asleep/offline", "status": "Answered", "detail": "Approved cloud tasks continue if the Mac disconnects, including private-file tasks within the existing task-scoped grant. Most work is cloud-first; local integration steps need a reachable device. Key custody/enforcement details remain design work."}, {"number": 46, "topic": "Technology preferences", "status": "Answered", "detail": "No strong language preference; choose based on product constraints, efficiency, fluid interaction and portability. Final stack requires engineering evaluation."}, {"number": 47, "topic": "Resource/development tradeoffs", "status": "Answered", "detail": "Efficient resource use and fluid/non-janky interactions matter more than shipping sooner. Numeric budgets and minimum hardware remain to be defined."}, {"number": 48, "topic": "Budget", "status": "Partial", "detail": "Cloudflare $5 base-plan target plus $20/month AI soft nudge; ask about higher spend but keep working. Actual usage costs and overrun safeguards need validation."}, {"number": 49, "topic": "First useful version", "status": "Answered", "detail": "Mac conversation, then coding April itself, dev deployments and GitHub PRs; discuss big features before implementation."}, {"number": 50, "topic": "Explicit deferrals", "status": "Partial", "detail": "Wake word, memory-provider research, other repos, web/Android later. Complete v1 scope boundary still needs refinement."}], "counts": {"Answered": 32, "Partial": 18, "Open": 0}, "resume": "Continue architecture refinement. Cloud-first tasks, cloud storage for all files, lightweight Mac client and approved task continuation after disconnect are confirmed. Do not reopen the offline-Mac/private-task question. Key custody, revocation and local-device availability handling remain implementation work.", "technicalFollowups": ["Confirmed: approved cloud tasks, including private-file tasks under existing task-scoped access, continue if the Mac disconnects. Next: specify key custody, revocation and device-unavailable handling; all persistent files are cloud-backed.", "Engineering evaluation: unified voice overlay and artifact workspace, plugin-ready architecture, low resource use and fluid interactions on the verified M2 Pro / 16 GB Mac.", "Private grants: task-end expiry is decided; specify revocation, terminal-state handling, derived-context cleanup, encryption keys and recovery.", "Sync: preserve both conflicting edits and ask the user is decided; specify lineage, resolution propagation, deletion and reconnection.", "Coding bootstrap: Cloudflare execution, April-only GitHub repositories, dev/PR/user approval flow are decided; validate macOS packaging/native tests and exact release evidence.", "Deferred deep dives: plugin contracts/trust, per-integration API versus UI, Codex-inspired computer use and memory systems including Supermemory.", "Operational implementation: accurate cost tracking and non-blocking $20 AI nudge, task retry/cancellation, recovery history and permission enforcement."]}, "questionReviewRevision": 1, "audienceRevision": 1, "pluginDirectionRevision": 1, "desktopAwarenessRevision": 1, "audioRequirementsRevision": 1, "backgroundAudioRevision": 1, "sessionFinalRevision": 1, "taskExpiryRevision": 1, "budgetCorrectionRevision": 1, "performanceRevision": 1, "wikiConflictRevision": 1, "proactivityRevision": 1, "capabilityGapRevision": 1, "hardwareRemoteRevision": 1, "syncConflictRevision": 1, "approvalLanguageRevision": 1, "replacementRevision": 1, "technicalFollowups": ["Confirmed: approved cloud tasks, including private-file tasks under existing task-scoped access, continue if the Mac disconnects. Next: specify key custody, revocation and device-unavailable handling; all persistent files are cloud-backed.", "Engineering evaluation: unified voice overlay and artifact workspace, plugin-ready architecture, low resource use and fluid interactions on the verified M2 Pro / 16 GB Mac.", "Private grants: task-end expiry is decided; specify revocation, terminal-state handling, derived-context cleanup, encryption keys and recovery.", "Sync: preserve both conflicting edits and ask the user is decided; specify lineage, resolution propagation, deletion and reconnection.", "Coding bootstrap: Cloudflare execution, April-only GitHub repositories, dev/PR/user approval flow are decided; validate macOS packaging/native tests and exact release evidence.", "Deferred deep dives: plugin contracts/trust, per-integration API versus UI, Codex-inspired computer use and memory systems including Supermemory.", "Operational implementation: accurate cost tracking and non-blocking $20 AI nudge, task retry/cancellation, recovery history and permission enforcement."], "pauseCheckpointRevision": 1, "cloudFirstContinuityRevision": 1, "vaultIndependentSessionRevision": 1, "personalVaultScopeRevision": 1, "singleThreadRevision": 1, "voiceTaskIsolationRevision": 1, "nestedDelegationRevision": 1, "taskAuditTreeRevision": 1, "pauseResumeRevision": 1, "pauseReasonRevision": 1, "blockedSpecialistRevision": 1, "offlineAutoSendRevision": 1, "voiceRecoveryRevision": 1, "voiceRecoveryTimeoutRevision": 1, "vaultMaterializationRevision": 1, "deletionReviewRevision": 1};
const KEY='personal-agent-system.workspace.v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=p=>p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);
const views=[['overview','Overview'],['agents','Agent registry'],['contracts','Shared contracts'],['platform','Platform map'],['decisions','Decisions'],['roadmap','Roadmap'],['ideas','Idea inbox'],['notes','Notes & sources']];
const agentStatuses=['Concept','Designing','Prototype','Active','Paused','Archived'];
const decisionStatuses=['Open','Proposed','Chosen direction','Needs investigation','Superseded'];
const taskStatuses=['Planned','In progress','Blocked','Done'];
let data=clone(SEED),view='overview',selected='main',search='',saveTimer,toastTimer,unsaved=false;
let storageProblem='';
try{const saved=localStorage.getItem(KEY);if(saved){const parsed=JSON.parse(saved);validate(parsed);data=parsed;}}catch(e){storageProblem='Local storage could not be loaded. Export JSON to preserve your work.';}
function validate(x){if(!x||x.schemaVersion!==1||!Array.isArray(x.agents)||!x.agents.length||!x.agents.some(a=>a.id==='main')||!x.contracts||typeof x.contracts!=='object')throw Error('Expected a version 1 workspace containing the main agent.');
for(const k of ['title','vision','principles','success','notes'])if(typeof x[k]!=='string')throw Error('Invalid field: '+k);
const fields={agents:['id','name','category','status','purpose','responsibilities','inputs','outputs','tools','permissions','boundaries','questions','firstMilestone','notes','dependencies'],platform:['id','name','layer','purpose','status','caveat','source','notes'],decisions:['id','title','status','rationale','next'],roadmap:['id','phase','title','status','notes'],ideas:['id','title','body','status'],sources:['title','url']};
for(const [collection,keys] of Object.entries(fields)){if(!Array.isArray(x[collection]))throw Error('Missing list: '+collection);if(x[collection].length>2000)throw Error('Too many records.');const ids=new Set();for(const row of x[collection]){if(!row||keys.some(k=>typeof row[k]!=='string'))throw Error('Invalid record in '+collection);if(row.id){if(ids.has(row.id))throw Error('Duplicate record ID.');ids.add(row.id);}}}

function setPath(path,value){const keys=path.split('.');let obj=data;for(const k of keys.slice(0,-1))obj=obj[k];obj[keys.at(-1)]=value;change();}

`<div class="callout">Cloudflare Computer supplies durable workspace tools. Sandboxes supply isolated execution. The agent harness supplies the reasoning loop. They are separate responsibilities.</div><div class="section">${data.platform.map((x,i)=>`<article class="platform-row"><div><div class="eyebrow">${esc(x.layer)}</div><h3>${esc(x.name)}</h3><span class="tag">${esc(x.status)}</span></div><div><p>${esc(x.purpose)}</p><p class="small muted">${esc(x.caveat)}</p>${x.notes?`<p class="small">Notes: ${esc(x.notes)}</p>`:''}${safeURL(x.source)?`<a class="small" href="${esc(x.source)}" target="_blank" rel="noopener noreferrer">Source documentation ↗</a>`:''}</div><button data-edit-platform="${i}">Develop this</button></article>`).join('')}</div>`;}

function roadmapView(){const phases=[...new Set(data.roadmap.map(t=>t.phase))];return heading('Incremental delivery','Build useful slices','A proposed sequence. Complete one end-to-end outcome before expanding the number of specialists. Update status as implementation evidence arrives.',`<button class="primary" data-action="add-task">+ Add milestone</button>`)+phases.map(p=>`<section class="phase"><h3>${esc(p)}</h3>${data.roadmap.map((t,i)=>t.phase!==p?'':`<div class="task"><div><input aria-label="Milestone title" data-path="roadmap.${i}.title" value="${esc(t.title)}"><p>${esc(t.notes)}</p></div><select aria-label="Milestone status" data-path="roadmap.${i}.status">${options(taskStatuses,t.status)}</select><button data-edit-task="${i}" aria-label="Edit milestone">···</button></div>`).join('')}</section>`).join('');}
function ideaView(){return heading('Room for the next idea','Idea inbox','Capture a possibility before deciding whether it needs a new agent, a tool, a workflow, or a simple preference.',`<button class="primary" data-action="add-idea">+ Capture idea</button>`)+data.ideas.map((x,i)=>`<article class="idea"><div class="row between"><span class="tag">${esc(x.status)}</span><button data-promote="${i}">Develop as agent</button></div><div style="margin-top:12px">${input('Idea',x.title,`ideas.${i}.title`)}${field('What I want / why it matters',x.body,`ideas.${i}.body`,5)}<label>Disposition<select data-path="ideas.${i}.status">${options(['Inbox','Exploring','Converted to agent','Later','Archived'],x.status)}</select></label></div></article>`).join('');}
function safeURL(x){try{const u=new URL(x);return u.protocol==='https:'||u.protocol==='http:';}catch{return false;}}
function notesView(){return heading('Context & reference','Working notes','Keep discoveries, changed assumptions, and questions here. Export your workspace before bringing it into another device or conversation.')+field('General notes',data.notes,'notes',13)+`<section class="section"><h2>Research starting points</h2><p class="muted small">Sources from the earlier discussion. These links do not update automatically. Technical status can change.</p>${data.sources.map(s=>`<div class="source">${safeURL(s.url)?`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)} ↗</a>`:esc(s.title)}</div>`).join('')}</section>`;}
function modal(html){$('#modal-root').innerHTML=`<div class="modal-wrap"><section class="modal" role="dialog" aria-modal="true" aria-label="Workspace dialog">${html}<div class="row"><button data-close>Close</button></div></section></div>`;$('#modal-root').querySelector('input,textarea,button')?.focus();}
function closeModal(){const root=$('#modal-root');root.innerHTML='';}
function newAgent(name='New specialist',purpose='Describe the outcome this specialist owns.'){const a={id:uid('agent'),name,category:'Specialist',status:'Concept',purpose,responsibilities:'',inputs:'',outputs:'',tools:'',permissions:'',boundaries:'',questions:'',firstMilestone:'',notes:'',dependencies:'Shared identity, job protocol, scoped permissions, audit trail'};data.agents.push(a);save();go('agents',a.id);}
function download(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);}
function md(){let text=`# ${data.title}\n\nExported: ${new Date().toISOString()}\n\n## Vision\n${data.vision}\n\n## Success\n${data.success}\n\n## Principles\n${data.principles}\n\n`;
for(const a of data.agents){text+=`## ${a.name}\nStatus: ${a.status} · Category: ${a.category}\n\n`;for(const [k,l] of Object.entries({purpose:'Purpose',responsibilities:'Responsibilities',inputs:'Inputs',outputs:'Outputs',tools:'Tools',permissions:'Authority',boundaries:'Boundaries',dependencies:'Dependencies',questions:'Open questions',firstMilestone:'First milestone',notes:'Notes'}))if(a[k])text+=`### ${l}\n${a[k]}\n\n`;}
text+='## Shared contracts\n';for(const [k,v] of Object.entries(data.contracts))text+=`### ${k}\n${v}\n\n`;
text+='## Platform\n';for(const p of data.platform)text+=`### ${p.name} (${p.status})\n${p.purpose}\n\n${p.caveat}\n${p.notes}\n${p.source}\n\n`;
text+='## Decisions\n';for(const d of data.decisions)text+=`### ${d.title} — ${d.status}\n${d.rationale}\n\nNext: ${d.next}\n\n`;
text+='## Roadmap\n';for(const t of data.roadmap)text+=`- [${t.status==='Done'?'x':' '}] ${t.phase}: ${t.title} (${t.status})\n  ${t.notes}\n`;
text+='\n## Ideas\n';for(const i of data.ideas)text+=`### ${i.title} (${i.status})\n${i.body}\n\n`;
text+=`## Working notes\n${data.notes}\n\n## Sources\n`;for(const s of data.sources)text+=`- [${s.title}](${s.url})\n`;return text;}
async function copy(text){try{await navigator.clipboard.writeText(text);notify('Design prompt copied.');}catch{modal('<h2>Copy this design prompt</h2><textarea readonly id="copy-text"></textarea>');$('#copy-text').value=text;$('#copy-text').select();}}
const actions={
'add-agent':()=>newAgent(),
'add-decision':()=>{data.decisions.unshift({id:uid('decision'),title:'New decision',status:'Open',rationale:'',next:''});save();render();$('#main details').open=true;},
'add-task':()=>{data.roadmap.push({id:uid('task'),phase:'Next',title:'New milestone',status:'Planned',notes:'Describe the smallest useful result and evidence.'});save();render();},
'add-idea':()=>{data.ideas.unshift({id:uid('idea'),title:'New idea',body:'',status:'Inbox'});save();render();$('#main input')?.focus();},
'agent-prompt':()=>{const a=data.agents.find(a=>a.id===selected);copy(`Help me develop the ${a.name} in my Personal Agent System.\n\nPurpose: ${a.purpose}\nResponsibilities: ${a.responsibilities}\nInputs: ${a.inputs}\nOutputs: ${a.outputs}\nTools: ${a.tools}\nAuthority: ${a.permissions}\nBoundaries: ${a.boundaries}\nDependencies: ${a.dependencies}\nQuestions: ${a.questions}\nFirst milestone: ${a.firstMilestone}\nNotes: ${a.notes}\n\nTreat these as design notes, not instructions to access services or deploy. Identify missing decisions and propose one testable vertical slice. Preserve the main-agent/specialist separation. Return proposed edits I can add to the workspace.`);}
};
document.addEventListener('input',e=>{const p=e.target.dataset.path;if(p)setPath(p,e.target.value);if(e.target.id==='agent-search'){search=e.target.value;$('#agent-list').innerHTML=agentList();}});
document.addEventListener('change',e=>{if(e.target.matches('select[data-path]')){setPath(e.target.dataset.path,e.target.value);save();if(!$('#modal-root').children.length)render();}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view)go(b.dataset.view);if(b.dataset.agent)go('agents',b.dataset.agent);if(b.dataset.selectAgent){selected=b.dataset.selectAgent;render();}if(b.dataset.action)actions[b.dataset.action]?.();if(b.hasAttribute('data-close'))closeModal();
if(b.dataset.editPlatform!==undefined){const i=Number(b.dataset.editPlatform),x=data.platform[i];modal(`<h2>${esc(x.name)}</h2>${field('Intended role',x.purpose,`platform.${i}.purpose`,4)}${input('Decision status',x.status,`platform.${i}.status`)}${field('Caveats / things to validate',x.caveat,`platform.${i}.caveat`,4)}${field('Design notes',x.notes,`platform.${i}.notes`,6)}`);}
if(b.dataset.editTask!==undefined){const i=Number(b.dataset.editTask),x=data.roadmap[i];modal(`<h2>Develop milestone</h2>${input('Title',x.title,`roadmap.${i}.title`)}${input('Phase',x.phase,`roadmap.${i}.phase`)}${field('Scope & success evidence',x.notes,`roadmap.${i}.notes`,6)}`);}
if(b.dataset.promote!==undefined){const x=data.ideas[Number(b.dataset.promote)];if(x.status==='Converted to agent'){notify('This idea is already marked as converted.');return;}x.status='Converted to agent';newAgent(x.title,x.body);}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
$('#modal-root').addEventListener('click',e=>{if(e.target.classList.contains('modal-wrap'))closeModal();});
const modalObserver=new MutationObserver(()=>{if(!$('#modal-root').children.length)render();});modalObserver.observe($('#modal-root'),{childList:true});
$('#export-json').onclick=()=>{save();download('personal-agent-system-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(data,null,2),'application/json');notify('JSON export requested. Keep this file as your portable backup.');};
$('#export-md').onclick=()=>{save();download('personal-agent-system-brief.md',md(),'text/markdown');notify('Brief export requested. Attach it to a future design conversation.');};
$('#import-btn').onclick=()=>$('#import-file').click();
$('#import-file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>5*1024*1024)throw Error('Workspace exceeds 5 MB.');const incoming=JSON.parse(await f.text());validate(incoming);modal(`<h2>Replace this workspace?</h2><p>Import contains ${incoming.agents.length} agents, ${incoming.decisions.length} decisions, and ${incoming.roadmap.length} milestones. Import replaces the current browser copy; it does not merge records.</p><p class="muted">Export your current JSON first if you want to keep it.</p><button id="confirm-import" class="primary">Replace with imported workspace</button>`);$('#confirm-import').onclick=()=>{data=incoming;selected='main';view='overview';save();closeModal();render();notify('Workspace imported.');};}catch(err){notify('Import rejected: '+err.message);}finally{e.target.value='';}};
$('#help-btn').onclick=()=>modal(`<div class="eyebrow">A living design, not a deployed system</div><h2>Keep building the idea</h2><p><strong>1. Start with the overview.</strong> Refine your vision and principles. Select a specialist in the diagram to develop its brief.</p><p><strong>2. Work one part at a time.</strong> Fill in roles, data access, boundaries, questions, and a first milestone. Copy an agent’s design prompt to continue in chat.</p><p><strong>3. Record choices.</strong> Use Decisions to separate proposals from chosen directions. Use Roadmap for small outcomes and Idea inbox for possibilities.</p><p><strong>4. Export regularly.</strong> Edits autosave only in this browser when local storage is available. Export JSON for backup or to import on another device. Export brief for a readable design document.</p><p><strong>5. Bring edits back.</strong> Attach the latest JSON or brief to a future chat. Ask for changes to a specific agent or contract. Import updated JSON to continue here.</p><p class="small muted">There is no cloud sync, account connection, agent execution, or telemetry in this file. Browser storage can be cleared. Moving the HTML file or changing browsers may use a different storage area. Do not enter API keys, private recordings, or other secrets into this planning workspace.</p>`);
window.addEventListener('beforeunload',e=>{if(unsaved){save();if(unsaved){e.preventDefault();e.returnValue='';}}});
render();$('#save-status').textContent=storageProblem?'Using starting content':'Ready · edits save in this browser';
</script>

<script id="april-map-code">
(()=>{
const client=false;
const original=client?document.querySelector('body>main'):document.querySelector('.app');
const map=document.createElement('div');map.id='amap';document.body.prepend(map);original.hidden=true;
const back=document.createElement('button');back.id='am-return';back.textContent='Return to map';back.hidden=true;document.body.append(back);
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let lens=client?'Experience':'System',active='root';
const find=t=>data.decisions.filter(d=>d.title===t);
const matching=terms=>data.decisions.filter(d=>terms.some(t=>d.title.toLowerCase().includes(t)));
const decision=t=>find(t);
const group=(id,title,caption,records,kind='decision')=>({id,title,caption,records,kind});
function groups(){
if(client){
 if(lens==='Experience')return[
 group('voice','Summon & speak','Hold to start · voice to dismiss',matching(['mac voice activation','replaceable realtime'])),
 group('presence','Desktop presence','Notch · active monitor · no focus theft',matching(['notch and multi','mac voice activation'])),
 group('workspace','One workspace','Obsidian-inspired · native to April',matching(['unified april','artifact types'])),
 group('vaults','Vault boundaries','Your folders · temporary private access',matching(['user-owned multi','private vault','cloud-hosted vault','centralized explicit approval'])),
 group('artifacts','Artifacts keep flowing','New / edited / action required',matching(['non-blocking artifact'])),
 group('devices','Across devices','Mac → web → Android',matching(['client rollout','platform-agnostic core'])),
 group('memory','Quiet memory','Inspectable · sensitive context separate',matching(['queryable and parallel','sensitive memory'])),
 group('offline','Offline fallback','Typed queue · eager sync',matching(['offline-first']))];
 if(lens==='Stack choices')return[
 group('shared','Shared UI candidates','Prototype before choosing',data.candidates.filter(c=>['tauri','electron','wails'].includes(c.id)),'candidate'),
 group('custom','Custom rendering','Editor-like alternatives',data.candidates.filter(c=>['gpui','iced','slint','egui'].includes(c.id)),'candidate'),
 group('native','Native & Go','Adapter or alternate shell',data.candidates.filter(c=>['swift','fyne','gio'].includes(c.id)),'candidate'),
 group('established','Other frameworks','Compare only where requirements fit',data.candidates.filter(c=>['qt','flutter','avalonia','raven'].includes(c.id)),'candidate'),
 group('ruled','Ruled out','Separate required Obsidian host',data.candidates.filter(c=>c.id==='obsidian-host'),'candidate')];
 if(lens==='Validation')return data.experiments.map(e=>group(e.id,e.title,e.status,[e],'experiment'));
 return[
 group('authority','Authority & review','Restrictive start · your approval',matching(['adjustable autonomy','user-led feature','self-extension'])),
 group('open','Unresolved questions','Next decisions to clarify',data.questions.split('\n').filter(Boolean).map((q,i)=>({title:q,rationale:'Open — not yet decided.',status:'Open',id:'question-'+i}))),
 group('all','Decision register','Confirmed, proposed and open',data.decisions),
 group('notes','Working notebook','Your ongoing notes',[{title:'Exploration notes',rationale:data.notes,status:'Working notes'}],'notebook')];
}
if(lens==='System')return[
 group('relationship','One relationship','Voice first · artifacts alongside',matching(['one interaction','voice-first surfaces'])),
 group('specialists','Specialist agents','Coding · research · media · recording',data.agents,'agent'),
 group('core','Portable core','Shared domain · native adapters',matching(['platform-agnostic core','client rollout','unified april'])),
 group('memory','Memory & context','Query + parallel enrichment',matching(['queryable and parallel','sensitive memory','canonical memory'])),
 group('authority','Autonomy & approval','User guardrails · learned approver',matching(['adjustable autonomy','autonomy through policy','user-led feature','centralized explicit approval'])),
 group('cloud','Cloud coordination','Cloudflare direction · services provisional',data.platform,'platform'),
 group('vaults','Local vaults','Files you own · scoped access',matching(['user-owned multi','private vault','non-blocking artifact'])),
 group('continuity','Across the day','Active device · offline queue',matching(['context-aware','offline-first','cross-device']))];
if(lens==='Specialists')return data.agents.map(a=>group(a.id,a.name,a.category,[a],'agent'));
if(lens==='Delivery')return[
 group('bootstrap','Bootstrap April','Conversation → coding → self-extension',matching(['self-extension','self-improving'])),
 group('plan','Discuss before building','You decide when the plan is ready',matching(['user-led feature'])),
 group('review','Development → PR → approval','Production follows user review',matching(['self-extension'])),
 group('roadmap','Milestones','A proposed sequence, not deployed work',data.roadmap,'task'),
 group('contracts','Task contracts','Scope · cancellation · evidence',Object.entries(data.contracts).map(([title,rationale])=>({title,rationale,status:'Draft contract'}))),
 group('mac','First integration','Mac → web → native Android',matching(['mac voice','notch and multi','client rollout','replaceable realtime']))];
return[
 group('technical-followups','Next technical session','Resume without repeating requirements',(data.technicalFollowups||[]).map((t,i)=>({title:'Follow-up '+(i+1),status:'Design / validation',rationale:t}))),
 group('question-review','Original Q&A review','32 answered · 18 partial · 0 open',(data.clarificationReview?.questions||[]).map(q=>({title:q.number+'. '+q.topic,status:q.status,rationale:q.detail}))),
 group('decisions','Decision register','Explore the rationale',data.decisions),
 group('questions','Open questions','Unresolved details across agents',data.agents.flatMap(a=>a.questions.split('\n').filter(Boolean).map(q=>({title:q,rationale:a.name,status:'Open'})))),
 group('ideas','Idea inbox','Future possibilities',data.ideas.map(i=>({title:i.title,rationale:i.body,status:i.status}))),
 group('notes','Working notebook','Portable design notes',[{title:'System notes',rationale:data.notes,status:'Working notes'}],'notebook')];
}

let editing=false,editSection=client?'Candidates':'Vision',editIndex=0;
function editorSections(){return client?['Candidates','Experiments','Decisions','Notebook']:['Vision','Agents','Platform','Decisions','Roadmap','Ideas','Contracts','Notebook']}
function editRecords(){const k={Candidates:'candidates',Experiments:'experiments',Decisions:'decisions',Agents:'agents',Platform:'platform',Roadmap:'roadmap',Ideas:'ideas'}[editSection];if(k)return data[k];if(editSection==='Contracts')return [data.contracts];return [data]}
function fieldKeys(r){if(editSection==='Vision')return ['title','vision','success','principles'];if(editSection==='Notebook')return client?['questions','notes']:['notes'];return Object.keys(r).filter(k=>typeof r[k]==='string'&&k!=='id')}
const labels={basis:'Discussion basis',strength:'Why consider it',risk:'Tradeoffs / uncertainty',next:'Next validation',firstMilestone:'First useful milestone',permissions:'Allowed authority',boundaries:'Boundaries',questions:'Open questions',rationale:'Rationale',source:'Source URL'};
function editorDraw(){
 const records=editRecords();editIndex=Math.max(0,Math.min(editIndex,records.length-1));const r=records[editIndex];
 map.innerHTML=`<header class="am-header"><div><div class="am-eyebrow">APRIL / DETAILED EDITOR</div><h1>${client?'Client exploration':'Agent system'}</h1><p>The same workspace, with room to edit every detail.</p></div><div class="am-actions"><label class="am-workspace-control"><select aria-label="Choose workspace" data-am-workspace><option value="client-exploration.html" ${client?'selected':''}>Client experience</option><option value="agent-system-workspace.html" ${!client?'selected':''}>Agent system</option></select></label><div class="am-mode-toggle" role="group" aria-label="Workspace view"><button data-am-mode="map" aria-pressed="${!editing}">Map</button><button data-am-mode="editor" aria-pressed="${editing}">Editor</button></div><button data-am-action="export">Export JSON</button><button data-am-action="import">Import JSON</button></div></header><div class="am-editor"><aside class="am-edit-nav" aria-label="Editor sections">${editorSections().map(s=>`<button data-am-section="${h(s)}" aria-pressed="${s===editSection}">${h(s)}</button>`).join('')}<p>Changes save in this browser. Export JSON to keep a portable copy.</p></aside><section class="am-edit-content"><div class="am-edit-top"><h2>${h(editSection)}</h2>${records.length>1?`<label>Record<select aria-label="Choose record" data-am-edit-select>${records.map((x,i)=>`<option value="${i}" ${i===editIndex?'selected':''}>${h(x.title||x.name||('Record '+(i+1)))}</option>`).join('')}</select></label>`:''}</div>${r?fieldKeys(r).map(k=>{const title=labels[k]||k.replace(/([A-Z])/g,' $1').replace(/^./,c=>c.toUpperCase());const short=['title','name','status','category','phase','language','source','url','updatedAt'].includes(k);return `<label class="am-edit-field">${h(title)}${short?`<input aria-label="${h(title)}" data-am-edit-field="${h(k)}" value="${h(r[k])}">`:`<textarea aria-label="${h(title)}" data-am-edit-field="${h(k)}" rows="${['notes','vision','rationale','responsibilities'].includes(k)?5:3}">${h(r[k])}</textarea>`}</label>`}).join(''):'<p>Select another section to continue.</p>'}</section></div><footer class="am-footer"><span id="am-save">Edits save locally · export before moving browsers.</span><span>Confirmed requirements and proposals retain their recorded status.</span></footer><input type="file" accept="application/json,.json" data-am-import-file hidden>`;
}

let zoom=1,needsFit=true,panX=0,panY=0,dragState=null,suppressMapClick=false;
function shortStatus(r){return r.status||r.category||r.layer||'Proposed'}
function details(g){
if(g.id==='root')return `<div class="am-eyebrow">SELECT A BRANCH TO EXPLORE</div><h2>${client?'April’s client experience':'April’s agent system'}</h2><p>${client?'A portable core with a Mac-first native experience. One app for voice, files and interactive artifacts.':'One interaction agent coordinates specialists. Local capabilities and cloud services stay behind explicit boundaries.'}</p><div class="am-route"><span>Mac</span>→<span>Web</span>→<span>Android</span></div><hr style="border:0;border-top:1px solid var(--mline);margin:22px 0"><h3>How to explore</h3><p>Select a branch, then expand only the decisions you want to inspect. Switch lenses above to explore ${client?'frameworks and tests':'specialists and delivery'}.</p><h3>Current direction</h3><p>Voice first. Artifacts over chat. Adjustable autonomy. User review before production.</p><h3>Still open</h3><p>GUI framework, core language and implementation details. The map documents a design, not running agents.</p>`;
let records=g.records;
return `<div class="am-eyebrow">${h(lens.toUpperCase())} / ${records.length} RECORD${records.length===1?'':'S'}</div><h2>${h(g.title)}</h2><p>${h(g.caption)}</p>`+records.map((r,i)=>{
const title=r.title||r.name;
let body='',edit='';
if(g.kind==='candidate')body=`<p>${h(r.basis)}</p><h3>Why consider it</h3><p>${h(r.strength)}</p><h3>Tradeoffs</h3><p>${h(r.risk)}</p><h3>Next validation</h3><p>${h(r.next)}</p>`;
else if(g.kind==='agent')body=`<p>${h(r.purpose)}</p><h3>Responsibilities</h3><p>${h(r.responsibilities)}</p><h3>First milestone</h3><p>${h(r.firstMilestone)}</p><h3>Boundaries</h3><p>${h(r.boundaries)}</p>`;
else if(g.kind==='platform')body=`<p>${h(r.purpose)}</p><h3>Uncertainty</h3><p>${h(r.caveat)}</p>`;
else if(g.kind==='experiment')body=`<p>${h(r.procedure)}</p><h3>Evidence to collect</h3><p>${h(r.evidence)}</p>`;
else if(g.kind==='task')body=`<p>${h(r.phase)}</p><p>${h(r.notes)}</p>`;
else body=`<p>${h(r.rationale||'')}</p>${r.next?`<h3>Next validation</h3><p>${h(r.next)}</p>`:''}`;
const statusOptions=g.kind==='candidate'?['Explore','Defer','Selected','Ruled out']:g.kind==='experiment'?['Planned','In progress','Passed','Failed','Inconclusive']:null;
if(statusOptions)edit+=`<label>Status<select data-am-record="${i}" data-am-field="status">${statusOptions.map(s=>`<option ${r.status===s?'selected':''}>${h(s)}</option>`).join('')}</select></label>`;
if(g.kind==='notebook')edit+=`<label>Working notes<textarea data-am-record="${i}" data-am-field="root-notes">${h(data.notes)}</textarea></label>`;
else if(['candidate','agent','experiment','task'].includes(g.kind))edit+=`<label>Working notes<textarea data-am-record="${i}" data-am-field="notes">${h(r.notes||'')}</textarea></label>`;
const url=r.source||'';
return `<details class="am-record" ${records.length===1?'open':''}><summary>${h(title)}</summary><span class="am-status">${h(shortStatus(r))}</span>${body}${/^https:\/\//.test(url)?`<p><a href="${h(url)}" target="_blank" rel="noopener">Primary reference</a></p>`:''}${edit}</details>`;
}).join('');
}
function draw(){
if(editing){editorDraw();return}
const all=groups().filter(g=>g.records.length);if(active!=='root'&&!all.some(g=>g.id===active))active='root';
const visible=all;const sideCount=Math.ceil(visible.length/2);const canvasWidth=1000,canvasHeight=Math.max(640,sideCount*150+70);const chosen=all.find(g=>g.id===active)||{id:'root'};const previousViewport=map.querySelector('.am-map');const oldLeft=previousViewport?.scrollLeft||0,oldTop=previousViewport?.scrollTop||0;
const lenses=client?['Experience','Stack choices','Validation','Decisions']:['System','Specialists','Delivery','Decisions'];
map.innerHTML=`<header class="am-header"><div><div class="am-eyebrow">APRIL / ${client?'CLIENT EXPLORATION':'SYSTEM DESIGN'}</div><h1>${client?'One app. Many possibilities.':'One relationship. Many specialists.'}</h1><p>Explore the map. Open details only when you need them.</p></div><div class="am-actions"><label class="am-workspace-control"><select aria-label="Choose workspace" data-am-workspace><option value="client-exploration.html" ${client?'selected':''}>Client experience</option><option value="agent-system-workspace.html" ${!client?'selected':''}>Agent system</option></select></label><div class="am-mode-toggle" role="group" aria-label="Workspace view"><button data-am-mode="map" aria-pressed="${!editing}">Map</button><button data-am-mode="editor" aria-pressed="${editing}">Editor</button></div><button data-am-action="export">Export JSON</button><button data-am-action="import">Import JSON</button></div></header><div class="am-lenses" role="group" aria-label="Map lenses">${lenses.map(l=>`<button data-am-lens="${h(l)}" aria-pressed="${l===lens}">${h(l)}</button>`).join('')}<span class="am-map-controls" role="group" aria-label="Map zoom"><button data-am-zoom="out" aria-label="Zoom out">−</button><output aria-label="Zoom level">${Math.round(zoom*100)}%</output><button data-am-zoom="in" aria-label="Zoom in">+</button></span></div><div class="am-layout"><section class="am-map" aria-label="${h(lens)} mind map" tabindex="0"><div class="am-stage" style="width:${canvasWidth*zoom}px;height:${canvasHeight*zoom}px;transform:translate(calc(-50% + ${panX}px),calc(-50% + ${panY}px))"><div class="am-canvas" style="width:${canvasWidth}px;height:${canvasHeight}px;transform:scale(${zoom})"><svg viewBox="0 0 ${canvasWidth} ${canvasHeight}" preserveAspectRatio="none" aria-hidden="true">${visible.map((g,i)=>{const left=i<sideCount;const row=left?i:i-sideCount;const x=left?284:716,y=85+row*150;return `<path d="M ${left?390:610} ${canvasHeight/2} C ${left?330:670} ${canvasHeight/2} ${left?340:660} ${y} ${x} ${y}" fill="none" stroke="${active===g.id?'var(--maccent)':'var(--mline)'}" stroke-width="${active===g.id?2:1}"/>`}).join('')}</svg><button class="am-node am-center" style="left:390px;top:${canvasHeight/2-48}px;width:220px" data-am-node="root" aria-pressed="${active==='root'}"><small>APRIL</small><strong>${h(lens)}</strong><small>${client?'Unified experience':'Portable agent core'}</small></button>${visible.map((g,i)=>`<button class="am-node" style="left:${i<sideCount?24:716}px;top:${40+(i<sideCount?i:i-sideCount)*150}px;width:260px" data-am-node="${h(g.id)}" aria-pressed="${g.id===active}"><span class="am-index">${String(i+1).padStart(2,'0')} / ${g.records.length} ${g.kind==='candidate'?'CHOICES':g.kind==='experiment'?'TEST':'RECORDS'}</span><strong>${h(g.title)}</strong><small>${h(g.caption)}</small></button>`).join('')}</div></div></section><aside class="am-inspector" aria-label="Selected branch details">${details(chosen)}</aside></div><footer class="am-footer"><span id="am-save">Edits save in this browser · export JSON to keep a portable copy.</span><span>31 October 2026 · confirmed decisions distinguished from proposals</span></footer><input type="file" accept="application/json,.json" data-am-import-file hidden>`;
const viewport=map.querySelector('.am-map');if(needsFit){needsFit=false;panX=0;panY=0;zoom=Math.min(1,((viewport?.clientWidth||1000)-16)/canvasWidth,((viewport?.clientHeight||640)-16)/canvasHeight);draw();return}
}
map.addEventListener('click',e=>{if(suppressMapClick&&e.target.closest('.am-map')){e.preventDefault();e.stopImmediatePropagation();suppressMapClick=false;}},true);
map.addEventListener('pointerdown',e=>{const viewport=e.target.closest('.am-map');if(!viewport||editing||e.button!==0||e.isPrimary===false)return;dragState={id:e.pointerId,x:e.clientX,y:e.clientY,startX:panX,startY:panY,moved:false,viewport};});
map.addEventListener('pointermove',e=>{if(!dragState||dragState.id!==e.pointerId)return;const dx=e.clientX-dragState.x,dy=e.clientY-dragState.y;if(!dragState.moved&&Math.hypot(dx,dy)<5)return;if(!dragState.moved){dragState.moved=true;dragState.viewport.setPointerCapture(e.pointerId);dragState.viewport.classList.add('am-dragging');}e.preventDefault();panX=dragState.startX+dx;panY=dragState.startY+dy;dragState.viewport.querySelector('.am-stage').style.transform=`translate(calc(-50% + ${panX}px),calc(-50% + ${panY}px))`;});
function endMapDrag(e){if(!dragState||dragState.id!==e.pointerId)return;const d=dragState;dragState=null;d.viewport.classList.remove('am-dragging');if(d.viewport.hasPointerCapture(e.pointerId))d.viewport.releasePointerCapture(e.pointerId);if(d.moved){suppressMapClick=true;setTimeout(()=>{suppressMapClick=false},0);}}
map.addEventListener('pointerup',endMapDrag);map.addEventListener('pointercancel',endMapDrag);map.addEventListener('lostpointercapture',e=>{if(dragState&&dragState.id===e.pointerId)endMapDrag(e)});
map.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.amLens){lens=b.dataset.amLens;active='root';needsFit=true;draw()}if(b.dataset.amNode){active=b.dataset.amNode;draw()}if(b.dataset.amZoom){zoom=Math.max(.15,Math.min(2,zoom+(b.dataset.amZoom==='in'?.1:-.1)));needsFit=false;draw()}if(b.dataset.amAction==='editor'){editing=true;editorDraw();window.scrollTo(0,0)}if(b.dataset.amAction==='export'){const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=client?'april-client-exploration.json':'april-agent-system.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);map.querySelector('#am-save').textContent='Export downloaded. Browser edits remain saved locally.'}});
// Only wheel gestures inside the map affect zoom; keep the rendered DOM stable during the gesture.
map.addEventListener('wheel',e=>{const viewport=e.target.closest('.am-map');if(!viewport||editing||!e.deltaY)return;e.preventDefault();const unit=e.deltaMode===1?16:e.deltaMode===2?(viewport.clientHeight||640):1;const delta=Math.max(-100,Math.min(100,e.deltaY*unit));zoom=Math.max(.15,Math.min(2,zoom*Math.exp(-delta*.002)));needsFit=false;const canvas=viewport.querySelector('.am-canvas'),stage=viewport.querySelector('.am-stage');canvas.style.transform=`scale(${zoom})`;stage.style.width=`${parseFloat(canvas.style.width)*zoom}px`;stage.style.height=`${parseFloat(canvas.style.height)*zoom}px`;map.querySelector('output[aria-label="Zoom level"]').textContent=Math.round(zoom*100)+'%';},{passive:false});
map.addEventListener('input',e=>{const i=e.target.dataset.amRecord;if(i===undefined)return;const g=groups().find(g=>g.id===active);const r=g.records[Number(i)];const f=e.target.dataset.amField;if(f==='root-notes')data.notes=e.target.value;else r[f]=e.target.value;save();map.querySelector('#am-save').textContent='Saved in this browser · export JSON to preserve edits.';if(f==='status'){const d=e.target.closest('details');d.querySelector('.am-status').textContent=e.target.value}});
map.addEventListener('change',e=>{if(e.target.hasAttribute('data-am-workspace')){const next=e.target.value;if(['client-exploration.html','agent-system-workspace.html'].includes(next)&&next!==(client?'client-exploration.html':'agent-system-workspace.html'))location.href=next}});

map.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.amMode){editing=b.dataset.amMode==='editor';draw()}if(b.dataset.amSection){editSection=b.dataset.amSection;editIndex=0;editorDraw()}if(b.dataset.amAction==='map'){editing=false;draw()}if(b.dataset.amAction==='import')map.querySelector('[data-am-import-file]').click()});
map.addEventListener('input',e=>{const key=e.target.dataset.amEditField;if(!key)return;editRecords()[editIndex][key]=e.target.value;save();map.querySelector('#am-save').textContent='Saved in this browser · export JSON to preserve edits.'});
map.addEventListener('change',async e=>{if(e.target.hasAttribute('data-am-edit-select')){editIndex=Number(e.target.value);editorDraw()}if(e.target.hasAttribute('data-am-import-file')){try{const f=e.target.files[0];if(!f)return;if(f.size>5*1024*1024)throw Error('File too large');const incoming=JSON.parse(await f.text());if(client){if(!valid(incoming))throw Error('Invalid structure')}else validate(incoming);if(!confirm('Replace this workspace with the imported JSON? Export first to preserve current edits.'))return;data=incoming;editIndex=0;save();draw();map.querySelector('#am-save').textContent='Imported and saved in this browser.'}catch{map.querySelector('#am-save').textContent='Import rejected. Use a complete compatible workspace export.'}}});

back.onclick=()=>{original.hidden=true;map.hidden=false;back.hidden=true;draw();window.scrollTo(0,0)};
draw();
})();
</script>
</body></html>
